name: Build Xiaomi Camellian Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out

  KERNEL_REPO: MiCode/Xiaomi_Kernel_OpenSource
  KERNEL_BRANCH: camellian-t-oss

  MODULE_REPO: MiCode/MTK_kernel_modules
  MODULE_BRANCH: camellian-t-oss

  TOOLCHAIN_DIR: toolchain/aarch64-linux-android-4.9

jobs:
  build:
    name: Build Camellian T
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # CHECKOUT KERNEL
      # ==========================================================

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: camellian-t-oss
          fetch-depth: 1

      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lz4 \
            lzop \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip \
            zstd

      # ==========================================================
      # SOURCE INFO
      # ==========================================================

      - name: Show source
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo " Kernel source"
          echo "=========================================="

          echo "Repository:"
          git remote get-url origin

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Branch:"
          git branch --show-current || true

          echo
          echo "Kernel version:"
          grep -E \
            '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' \
            Makefile || true

      # ==========================================================
      # CHECK MTK MODULE REPOSITORY
      # ==========================================================

      - name: Checkout MTK kernel modules
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo " MTK kernel modules"
          echo "=========================================="

          mkdir -p vendor/xiaomi

          git clone \
            --depth=1 \
            --branch camellian-t-oss \
            https://github.com/MiCode/MTK_kernel_modules.git \
            vendor/xiaomi/kernel_modules

          echo
          echo "Module repository:"
          git -C vendor/xiaomi/kernel_modules \
            remote get-url origin

          echo
          echo "Module commit:"
          git -C vendor/xiaomi/kernel_modules \
            rev-parse HEAD

      # ==========================================================
      # SHOW MODULE TREE
      # ==========================================================

      - name: Inspect MTK modules
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo " MTK module tree"
          echo "=========================================="

          find vendor/xiaomi/kernel_modules \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -500

          echo
          echo "MIHW files:"

          find vendor/xiaomi/kernel_modules \
            -type f \
            | grep -Ei 'mihw|millet' \
            | sort \
            || true

      # ==========================================================
      # GCC 4.9
      # ==========================================================

      - name: Download GCC 4.9
        shell: bash
        run: |
          set -eux

          TOOLCHAIN="$GITHUB_WORKSPACE/$TOOLCHAIN_DIR"

          rm -rf "$TOOLCHAIN"

          mkdir -p "$(dirname "$TOOLCHAIN")"

          git clone \
            --depth=1 \
            --branch ndk-release-r18 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$TOOLCHAIN"

          chmod +x "$TOOLCHAIN/bin/"* || true

          GCC="$TOOLCHAIN/bin/aarch64-linux-android-gcc"

          test -f "$GCC"

          echo
          echo "GCC:"
          "$GCC" --version

          echo "ANDROID_GCC=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

      # ==========================================================
      # FIND DEFCONFIG
      # ==========================================================

      - name: Find defconfig
        id: config
        shell: bash
        run: |
          set -eux

          CONFIG_DIR="arch/arm64/configs"

          echo "=========================================="
          echo " Defconfigs"
          echo "=========================================="

          find "$CONFIG_DIR" \
            -type f \
            -name '*defconfig' \
            | sort

          DEFCONFIG_FILE="$(
            find "$CONFIG_DIR" \
              -type f \
              \( \
                -iname '*camellian*defconfig' \
                -o -iname '*camellia*defconfig' \
                -o -iname '*mt6785*defconfig' \
              \) \
              | sort \
              | head -n 1
          )"

          if [ -z "$DEFCONFIG_FILE" ]; then
            echo "::error::Camellian defconfig not found."
            exit 1
          fi

          DEFCONFIG="${DEFCONFIG_FILE#arch/arm64/configs/}"

          echo "Selected:"
          echo "$DEFCONFIG"

          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # PREPARE OUT
      # ==========================================================

      - name: Prepare output
        shell: bash
        run: |
          set -eux

          rm -rf "$OUT_DIR"

          mkdir -p "$OUT_DIR"

      # ==========================================================
      # DEFCONFIG
      # ==========================================================

      - name: Generate defconfig
        env:
          DEFCONFIG: ${{ steps.config.outputs.DEFCONFIG }}
        shell: bash
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$ANDROID_GCC/bin/aarch64-linux-android-"

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            "$DEFCONFIG"

      # ==========================================================
      # FIX MISSING OSS MILLET
      # ==========================================================

      - name: Disable unavailable Millet module
        shell: bash
        run: |
          set -eux

          CONFIG="$OUT_DIR/.config"

          echo "=========================================="
          echo " Checking MIHW / MILLET"
          echo "=========================================="

          echo
          echo "Before:"
          grep -E \
            '^CONFIG_(MIHW|MILLET)=' \
            "$CONFIG" \
            || true

          MILLET_MAKEFILE="vendor/xiaomi/kernel_modules/mihw/millet/Makefile"

          if [ ! -f "$MILLET_MAKEFILE" ]; then

            echo
            echo "Millet source is not present."

            echo "Disabling CONFIG_MILLET."

            scripts/config \
              --file "$CONFIG" \
              -d CONFIG_MILLET \
              2>/dev/null \
              || sed -i \
                -E \
                's/^CONFIG_MILLET=.*/# CONFIG_MILLET is not set/' \
                "$CONFIG"

          else

            echo
            echo "Millet source found."

          fi

          make \
            O="$OUT_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE="$ANDROID_GCC/bin/aarch64-linux-android-" \
            olddefconfig

          echo
          echo "After:"
          grep -E \
            '^CONFIG_(MIHW|MILLET)=' \
            "$CONFIG" \
            || true

      # ==========================================================
      # VERIFY CONFIG
      # ==========================================================

      - name: Verify configuration
        shell: bash
        run: |
          set -eux

          CONFIG="$OUT_DIR/.config"

          test -f "$CONFIG"

          echo "=========================================="
          echo " Configuration"
          echo "=========================================="

          echo
          echo "ARM64:"
          grep '^CONFIG_ARM64=' "$CONFIG" || true

          echo
          echo "MIHW:"
          grep '^CONFIG_MIHW=' "$CONFIG" || true

          echo
          echo "MILLET:"
          grep '^CONFIG_MILLET=' "$CONFIG" || true

          echo
          echo "Modules:"
          grep '^CONFIG_MODULES=' "$CONFIG" || true

      # ==========================================================
      # COMPILER TEST
      # ==========================================================

      - name: Test compiler
        shell: bash
        run: |
          set -eux

          GCC="$ANDROID_GCC/bin/aarch64-linux-android-gcc"

          cat > /tmp/test.c <<'EOF'
          int test_function(const char *input)
          {
              char buffer[128];

              if (input)
                  buffer[0] = input[0];

              return 0;
          }
          EOF

          "$GCC" \
            -fstack-protector-strong \
            -c \
            /tmp/test.c \
            -o /tmp/test.o

          file /tmp/test.o

      # ==========================================================
      # BUILD KERNEL
      # ==========================================================

      - name: Build kernel
        shell: bash
        run: |
          set -o pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$ANDROID_GCC/bin/aarch64-linux-android-"

          echo "=========================================="
          echo " Building kernel"
          echo "=========================================="

          "$ANDROID_GCC/bin/aarch64-linux-android-gcc" \
            --version

          set +e

          make \
            -j1 \
            V=1 \
            KBUILD_VERBOSE=1 \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            2>&1 | tee kernel-build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "=========================================="
          echo " BUILD ERROR SUMMARY"
          echo "=========================================="

          grep -nEi \
            'error:|fatal error:|undefined reference|No rule to make|Error [0-9]+|cannot find' \
            kernel-build.log | tail -100 || true

          exit "$BUILD_STATUS"

      # ==========================================================
      # BUILD MODULES
      # ==========================================================

      - name: Build modules
        shell: bash
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$ANDROID_GCC/bin/aarch64-linux-android-"

          if grep -q '^CONFIG_MODULES=y' "$OUT_DIR/.config"; then

            make \
              -j1 \
              V=1 \
              O="$OUT_DIR" \
              ARCH="$ARCH" \
              SUBARCH="$SUBARCH" \
              CROSS_COMPILE="$CROSS_COMPILE" \
              modules

          else

            echo "Kernel modules disabled."

          fi

      # ==========================================================
      # DTBS
      # ==========================================================

      - name: Build DTBs
        shell: bash
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$ANDROID_GCC/bin/aarch64-linux-android-"

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            dtbs

      # ==========================================================
      # INSTALL MODULES
      # ==========================================================

      - name: Install modules
        shell: bash
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$ANDROID_GCC/bin/aarch64-linux-android-"

          if grep -q '^CONFIG_MODULES=y' "$OUT_DIR/.config"; then

            rm -rf "$OUT_DIR/modules"

            mkdir -p "$OUT_DIR/modules"

            make \
              O="$OUT_DIR" \
              ARCH="$ARCH" \
              SUBARCH="$SUBARCH" \
              CROSS_COMPILE="$CROSS_COMPILE" \
              modules_install \
              INSTALL_MOD_PATH="$GITHUB_WORKSPACE/$OUT_DIR/modules"

          fi

      # ==========================================================
      # DIAGNOSTICS
      # ==========================================================

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          echo "=========================================="
          echo " DIAGNOSTICS"
          echo "=========================================="
          for LOG in kernel-build.log modules-build.log; do
            if [ -f "$LOG" ]; then
              echo "--- $LOG ---"
              grep -nEi \
                'error:|fatal error:|undefined reference|No rule to make|Error [0-9]+|cannot find' \
                "$LOG" | tail -100 || true
            fi
          done
          echo "--- compiler ---"
          "$ANDROID_GCC/bin/aarch64-linux-android-gcc" --version || true
          echo "--- kernel config ---"
          if [ -f "$OUT_DIR/.config" ]; then
            grep -E '^CONFIG_(ARM64|MODULES|MIHW|MILLET)=' "$OUT_DIR/.config" || true
          fi

      # ==========================================================
      # COLLECT
      # ==========================================================

      - name: Collect kernel
        shell: bash
        run: |
          set -eux

          rm -rf release

          mkdir -p \
            release/dtb \
            release/dtbo \
            release/modules

          BOOT="$OUT_DIR/arch/arm64/boot"

          for IMAGE in \
            Image \
            Image.gz \
            Image.lz4 \
            Image.gz-dtb \
            Image-dtb
          do

            if [ -f "$BOOT/$IMAGE" ]; then
              cp "$BOOT/$IMAGE" "release/$IMAGE"
            fi

          done

          find "$BOOT" \
            -type f \
            -name '*.dtb' \
            -exec cp {} release/dtb/ \; \
            || true

          find "$BOOT" \
            -type f \
            -name '*.dtbo' \
            -exec cp {} release/dtbo/ \; \
            || true

          find "$OUT_DIR" \
            -type f \
            -name '*.ko' \
            -exec cp {} release/modules/ \; \
            || true

          echo
          echo "Release:"
          find release \
            -type f \
            | sort

      # ==========================================================
      # VALIDATE
      # ==========================================================

      - name: Validate kernel
        shell: bash
        run: |
          set -eux

          FOUND=0

          for IMAGE in \
            release/Image \
            release/Image.gz \
            release/Image.lz4 \
            release/Image.gz-dtb \
            release/Image-dtb
          do

            if [ -f "$IMAGE" ]; then
              echo "Found: $IMAGE"
              FOUND=1
            fi

          done

          if [ "$FOUND" -eq 0 ]; then
            echo "::error::No kernel image generated."
            exit 1
          fi

      # ==========================================================
      # MODULES.LOAD
      # ==========================================================

      - name: Generate modules.load
        shell: bash
        run: |
          set -eux

          : > release/modules.load

          find release/modules \
            -maxdepth 1 \
            -type f \
            -name '*.ko' \
            -printf '%f\n' \
            | sort \
            > release/modules.load

      # ==========================================================
      # BUILD INFO
      # ==========================================================

      - name: Generate build info
        env:
          DEFCONFIG: ${{ steps.config.outputs.DEFCONFIG }}
        shell: bash
        run: |
          set -eux

          KERNEL_VERSION="$(
            make \
              O="$OUT_DIR" \
              ARCH=arm64 \
              kernelversion \
              2>/dev/null \
              || echo unknown
          )"

          cat > release/build-info.txt <<EOF
          Xiaomi Camellian Kernel
          =======================

          Device:
          POCO M3 Pro 5G
          Redmi Note 10 5G
          Redmi Note 10T

          Codename:
          camellian

          SoC:
          MediaTek MT6785

          Android:
          Android T

          Kernel repository:
          MiCode/Xiaomi_Kernel_OpenSource

          Kernel branch:
          camellian-t-oss

          Kernel commit:
          $(git rev-parse HEAD)

          Module repository:
          MiCode/MTK_kernel_modules

          Module branch:
          camellian-t-oss

          Module commit:
          $(git -C vendor/xiaomi/kernel_modules rev-parse HEAD)

          Kernel version:
          $KERNEL_VERSION

          Defconfig:
          $DEFCONFIG

          Compiler:
          AArch64 Android GCC 4.9

          Build date:
          $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EOF

          cat release/build-info.txt

      # ==========================================================
      # PACKAGE
      # ==========================================================

      - name: Package kernel
        shell: bash
        run: |
          set -eux

          ZIP_NAME="camellian-kernel-${GITHUB_SHA::7}.zip"

          cd release

          zip \
            -r \
            "../$ZIP_NAME" \
            . \
            >/dev/null

          cd ..

          ls -lh "$ZIP_NAME"

      # ==========================================================
      # ARTIFACT
      # ==========================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: camellian-kernel
          path: |
            camellian-kernel-*.zip
            release/
            kernel-build.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
          if: always()
