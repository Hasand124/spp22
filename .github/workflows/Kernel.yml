name: Build Xiaomi Camellian Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # CHECKOUT KERNEL
      # =========================================================

      - name: Checkout camellian-t-oss
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: camellian-t-oss
          fetch-depth: 1

      # =========================================================
      # DEPENDENCIES
      # =========================================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            device-tree-compiler \
            cpio \
            rsync \
            python3 \
            git \
            wget \
            curl \
            unzip \
            zip \
            lz4 \
            lzop \
            zstd

      # =========================================================
      # SOURCE INFORMATION
      # =========================================================

      - name: Kernel information
        run: |
          echo "=========================================="
          echo " Xiaomi Camellian Kernel"
          echo "=========================================="

          echo "Repository:"
          echo "MiCode/Xiaomi_Kernel_OpenSource"

          echo
          echo "Branch:"
          git branch --show-current || true

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Commit short:"
          git rev-parse --short HEAD

          echo
          echo "Kernel version:"
          make kernelversion || true

      # =========================================================
      # DOWNLOAD AARCH64 GCC 4.9
      # =========================================================

      - name: Download AArch64 GCC 4.9
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/toolchain"

          TOOLCHAIN="$GITHUB_WORKSPACE/toolchain/aarch64-linux-android-4.9"

          echo "=========================================="
          echo " Downloading Android GCC 4.9"
          echo "=========================================="

          git clone \
            --depth=1 \
            --single-branch \
            --branch google \
            https://github.com/GrowtopiaJaw/aarch64-linux-android-4.9.git \
            "$TOOLCHAIN"

          echo
          echo "Checking toolchain..."

          if [ ! -d "$TOOLCHAIN/bin" ]; then
            echo "ERROR: bin directory not found!"
            find "$TOOLCHAIN" -maxdepth 3 -type d | sort
            exit 1
          fi

          if [ ! -f "$TOOLCHAIN/bin/aarch64-linux-android-gcc" ]; then
            echo "ERROR: aarch64-linux-android-gcc not found!"
            find "$TOOLCHAIN" -type f \
              -name "*gcc*" \
              | sort
            exit 1
          fi

          chmod +x "$TOOLCHAIN/bin/"* || true

          echo
          echo "GCC binaries:"
          ls -lh "$TOOLCHAIN/bin/" | head -50

          echo
          echo "GCC version:"
          "$TOOLCHAIN/bin/aarch64-linux-android-gcc" --version

      # =========================================================
      # SETUP GCC
      # =========================================================

      - name: Setup GCC
        shell: bash
        run: |

          GCC_PATH="$GITHUB_WORKSPACE/toolchain/aarch64-linux-android-4.9/bin"

          echo "$GCC_PATH" >> "$GITHUB_PATH"

          echo "GCC_PATH=$GCC_PATH"

          echo
          echo "Testing compiler..."

          command -v aarch64-linux-android-gcc

          aarch64-linux-android-gcc --version

      # =========================================================
      # FIND DEFCONFIG
      # =========================================================

      - name: Find Camellian defconfig
        id: defconfig
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " Searching defconfig"
          echo "=========================================="

          echo
          echo "Available ARM64 defconfigs:"
          find arch/arm64/configs \
            -type f \
            -name "*defconfig" \
            | sort

          echo
          echo "Searching Camellian..."

          DEFCONFIG_FILE=""

          while IFS= read -r file; do
            DEFCONFIG_FILE="$file"
            break
          done < <(
            find arch/arm64/configs \
              -type f \
              \( \
                -iname "*camellian*defconfig" \
                -o \
                -iname "*camellian*_defconfig" \
              \) \
              | sort
          )

          if [ -z "$DEFCONFIG_FILE" ]; then
            echo
            echo "ERROR:"
            echo "No Camellian defconfig was found."
            echo
            echo "Please inspect the list above."
            exit 1
          fi

          DEFCONFIG=$(basename "$DEFCONFIG_FILE")

          echo
          echo "Selected defconfig:"
          echo "$DEFCONFIG"

          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_OUTPUT"

      # =========================================================
      # CLEAN OUTPUT
      # =========================================================

      - name: Prepare output
        run: |
          rm -rf "$OUT_DIR"

          mkdir -p "$OUT_DIR"

          echo "Output directory:"
          pwd
          echo "$OUT_DIR"

      # =========================================================
      # GENERATE DEFCONFIG
      # =========================================================

      - name: Generate defconfig
        env:
          DEFCONFIG: ${{ steps.defconfig.outputs.DEFCONFIG }}
        shell: bash
        run: |

          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-"

          echo "=========================================="
          echo " Generating kernel configuration"
          echo "=========================================="

          echo "ARCH=$ARCH"
          echo "SUBARCH=$SUBARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "DEFCONFIG=$DEFCONFIG"

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            "$DEFCONFIG"

      # =========================================================
      # CHECK CONFIG
      # =========================================================

      - name: Check configuration
        shell: bash
        run: |

          echo "=========================================="
          echo " Kernel configuration"
          echo "=========================================="

          if [ ! -f "$OUT_DIR/.config" ]; then
            echo "ERROR: .config was not generated."
            exit 1
          fi

          echo
          echo "Compiler:"
          grep -E \
            '^CONFIG_CC_IS_GCC=' \
            "$OUT_DIR/.config" \
            || true

          echo
          echo "Stack protector:"
          grep -E \
            '^CONFIG_CC_STACKPROTECTOR' \
            "$OUT_DIR/.config" \
            || true

          echo
          echo "Modules:"
          grep -E \
            '^CONFIG_MODULES=' \
            "$OUT_DIR/.config" \
            || true

          echo
          echo "ARM64:"
          grep -E \
            '^CONFIG_ARM64=' \
            "$OUT_DIR/.config" \
            || true

      # =========================================================
      # TEST CROSS COMPILER
      # =========================================================

      - name: Test cross compiler
        shell: bash
        run: |

          set -e

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-"

          echo "=========================================="
          echo " Compiler test"
          echo "=========================================="

          command -v "${CROSS_COMPILE}gcc"
          command -v "${CROSS_COMPILE}ld"
          command -v "${CROSS_COMPILE}ar"
          command -v "${CROSS_COMPILE}objcopy"

          echo
          echo "GCC:"
          "${CROSS_COMPILE}gcc" --version

          echo
          echo "LD:"
          "${CROSS_COMPILE}ld" --version | head -1

          echo
          echo "Testing stack protector..."

          cat > /tmp/test.c <<'EOF'
          int test_function(const char *input)
          {
              char buffer[32];

              if (input)
                  buffer[0] = input[0];

              return 0;
          }
          EOF

          "${CROSS_COMPILE}gcc" \
            -fstack-protector-strong \
            -c /tmp/test.c \
            -o /tmp/test.o

          echo
          echo "Stack protector test: OK"

      # =========================================================
      # BUILD KERNEL
      # =========================================================

      - name: Build kernel
        shell: bash
        run: |

          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-"

          echo "=========================================="
          echo " BUILDING KERNEL"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE"

      # =========================================================
      # BUILD MODULES
      # =========================================================

      - name: Build kernel modules
        shell: bash
        run: |

          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-"

          if grep -q '^CONFIG_MODULES=y' "$OUT_DIR/.config"; then

            echo "=========================================="
            echo " BUILDING MODULES"
            echo "=========================================="

            make \
              -j"$(nproc)" \
              O="$OUT_DIR" \
              ARCH="$ARCH" \
              SUBARCH="$SUBARCH" \
              CROSS_COMPILE="$CROSS_COMPILE" \
              modules

          else

            echo "CONFIG_MODULES is not enabled."
            echo "Skipping modules."

          fi

      # =========================================================
      # INSTALL MODULES
      # =========================================================

      - name: Install kernel modules
        shell: bash
        run: |

          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-"

          if grep -q '^CONFIG_MODULES=y' "$OUT_DIR/.config"; then

            mkdir -p "$OUT_DIR/modules"

            make \
              O="$OUT_DIR" \
              ARCH="$ARCH" \
              SUBARCH="$SUBARCH" \
              CROSS_COMPILE="$CROSS_COMPILE" \
              modules_install \
              INSTALL_MOD_PATH="$GITHUB_WORKSPACE/$OUT_DIR/modules"

          fi

      # =========================================================
      # BUILD DTB
      # =========================================================

      - name: Build DTBs
        shell: bash
        run: |

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-"

          echo "=========================================="
          echo " BUILDING DTB"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            dtbs

      # =========================================================
      # SHOW OUTPUT
      # =========================================================

      - name: Show build output
        if: always()
        shell: bash
        run: |

          echo "=========================================="
          echo " ARM64 BOOT OUTPUT"
          echo "=========================================="

          find "$OUT_DIR/arch/arm64/boot" \
            -maxdepth 4 \
            -type f \
            -print \
            | sort \
            || true

          echo
          echo "=========================================="
          echo " KERNEL MODULES"
          echo "=========================================="

          find "$OUT_DIR" \
            -type f \
            -name "*.ko" \
            -print \
            | sort \
            || true

      # =========================================================
      # COLLECT RELEASE
      # =========================================================

      - name: Collect release
        shell: bash
        run: |

          set -e

          rm -rf release

          mkdir -p release
          mkdir -p release/dtb
          mkdir -p release/modules

          # -----------------------------------------------------
          # Kernel
          # -----------------------------------------------------

          for file in \
            Image \
            Image.gz \
            Image.lz4 \
            Image.gz-dtb
          do

            if [ -f "$OUT_DIR/arch/arm64/boot/$file" ]; then
              cp "$OUT_DIR/arch/arm64/boot/$file" \
                 "release/$file"
            fi

          done

          # -----------------------------------------------------
          # DTB
          # -----------------------------------------------------

          find "$OUT_DIR/arch/arm64/boot" \
            -type f \
            -name "*.dtb" \
            -exec cp {} release/dtb/ \; \
            || true

          # -----------------------------------------------------
          # DTBO
          # -----------------------------------------------------

          find "$OUT_DIR/arch/arm64/boot" \
            -type f \
            -name "*.dtbo" \
            -exec cp {} release/dtb/ \; \
            || true

          # -----------------------------------------------------
          # Kernel modules
          # -----------------------------------------------------

          find "$OUT_DIR" \
            -type f \
            -name "*.ko" \
            -exec cp {} release/modules/ \; \
            || true

          # -----------------------------------------------------
          # modules.load
          # -----------------------------------------------------

          find release/modules \
            -type f \
            -name "*.ko" \
            -printf "%f\n" \
            | sort \
            > release/modules.load

          echo
          echo "Release:"
          find release \
            -type f \
            -print \
            | sort

      # =========================================================
      # BUILD INFORMATION
      # =========================================================

      - name: Create build info
        env:
          DEFCONFIG: ${{ steps.defconfig.outputs.DEFCONFIG }}
        run: |

          cat > release/build-info.txt <<EOF
          ==========================================
          Xiaomi Camellian Kernel
          ==========================================

          Device:
          POCO M3 Pro 5G
          Redmi Note 10 5G
          Redmi Note 10T

          Codename:
          camellian

          Platform:
          MediaTek MT6785

          Android:
          Android T

          Repository:
          MiCode/Xiaomi_Kernel_OpenSource

          Branch:
          camellian-t-oss

          Commit:
          $(git rev-parse HEAD)

          Commit short:
          $(git rev-parse --short HEAD)

          Kernel version:
          $(make kernelversion 2>/dev/null || echo unknown)

          Architecture:
          arm64

          Defconfig:
          ${DEFCONFIG}

          Compiler:
          Android GCC 4.9

          Build date:
          $(date -u)

          ==========================================
          EOF

          cat release/build-info.txt

      # =========================================================
      # PACKAGE ZIP
      # =========================================================

      - name: Package kernel
        shell: bash
        run: |

          set -e

          ZIP_NAME="camellian-kernel-${GITHUB_SHA::7}.zip"

          cd release

          zip -r \
            "../$ZIP_NAME" \
            . \
            >/dev/null

          cd ..

          echo
          echo "=========================================="
          echo " PACKAGE"
          echo "=========================================="

          ls -lh "$ZIP_NAME"

      # =========================================================
      # UPLOAD KERNEL
      # =========================================================

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: camellian-kernel
          path: |
            camellian-kernel-*.zip
            release/build-info.txt
            release/modules.load
          if-no-files-found: error

      # =========================================================
      # UPLOAD RAW OUTPUT
      # =========================================================

      - name: Upload raw kernel
        uses: actions/upload-artifact@v4
        with:
          name: camellian-kernel-raw
          path: |
            release/
          if-no-files-found: error

