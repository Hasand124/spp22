name: Build Xiaomi Camellian Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  TOOLCHAIN_DIR: toolchain/aarch64-linux-android-4.9

  KERNEL_REPO: MiCode/Xiaomi_Kernel_OpenSource
  KERNEL_BRANCH: camellian-t-oss

  MODULE_REPO: MiCode/MTK_kernel_modules
  MODULE_BRANCH: camellian-t-oss

jobs:
  build:
    name: Build Camellian T Kernel
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # CHECKOUT MAIN KERNEL
      # ==========================================================

      - name: Checkout Xiaomi kernel
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: camellian-t-oss
          fetch-depth: 1

      # ==========================================================
      # INSTALL DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lz4 \
            lzop \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip \
            zstd

      # ==========================================================
      # CHECKOUT MTK KERNEL MODULES
      # ==========================================================

      - name: Checkout Xiaomi MTK kernel modules
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo " Xiaomi MTK kernel modules"
          echo "=========================================="

          MODULE_ROOT="$GITHUB_WORKSPACE/vendor/xiaomi/kernel_modules"

          rm -rf "$MODULE_ROOT"

          mkdir -p \
            "$GITHUB_WORKSPACE/vendor/xiaomi"

          git clone \
            --depth=1 \
            --branch camellian-t-oss \
            https://github.com/MiCode/MTK_kernel_modules.git \
            "$MODULE_ROOT"

          echo
          echo "Module repository:"
          git -C "$MODULE_ROOT" remote get-url origin

          echo
          echo "Module commit:"
          git -C "$MODULE_ROOT" rev-parse HEAD

          echo
          echo "Module branch:"
          git -C "$MODULE_ROOT" branch --show-current

      # ==========================================================
      # VERIFY MIHW / MILLET
      # ==========================================================

      - name: Verify Xiaomi MIHW modules
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo " Verifying Xiaomi MIHW"
          echo "=========================================="

          MODULE_ROOT="$GITHUB_WORKSPACE/vendor/xiaomi/kernel_modules"

          MILLET_DIR="$MODULE_ROOT/mihw/millet"
          MILLET_MAKEFILE="$MILLET_DIR/Makefile"

          echo "MODULE_ROOT:"
          echo "$MODULE_ROOT"

          echo
          echo "MILLET:"
          echo "$MILLET_DIR"

          echo
          echo "Checking Makefile..."

          if [ ! -f "$MILLET_MAKEFILE" ]; then

            echo "::error::Millet Makefile is missing."

            echo
            echo "Available MIHW files:"

            find "$MODULE_ROOT" \
              -type f \
              | grep -Ei \
                'mihw|millet' \
              | sort \
              | head -500 \
              || true

            exit 1
          fi

          echo
          echo "Millet Makefile found:"
          ls -lh "$MILLET_MAKEFILE"

          echo
          echo "MIHW directory:"
          find "$MODULE_ROOT/mihw" \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -500

      # ==========================================================
      # SOURCE INFORMATION
      # ==========================================================

      - name: Show source information
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo " Kernel source"
          echo "=========================================="

          echo "Kernel repository:"
          git remote get-url origin

          echo
          echo "Kernel commit:"
          git rev-parse HEAD

          echo
          echo "Kernel branch:"
          git branch --show-current || true

          echo
          echo "Kernel version:"
          grep -E \
            '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' \
            Makefile || true

          echo
          echo "=========================================="
          echo " Module source"
          echo "=========================================="

          git -C vendor/xiaomi/kernel_modules \
            remote get-url origin

          echo
          echo "Module commit:"
          git -C vendor/xiaomi/kernel_modules \
            rev-parse HEAD

      # ==========================================================
      # DOWNLOAD GCC 4.9
      # ==========================================================

      - name: Download Android GCC 4.9
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo " Android GCC 4.9"
          echo "=========================================="

          TOOLCHAIN="$GITHUB_WORKSPACE/$TOOLCHAIN_DIR"

          rm -rf "$TOOLCHAIN"

          mkdir -p "$(dirname "$TOOLCHAIN")"

          git clone \
            --depth=1 \
            --branch ndk-release-r18 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$TOOLCHAIN"

          GCC="$TOOLCHAIN/bin/aarch64-linux-android-gcc"

          if [ ! -f "$GCC" ]; then
            echo "::error::GCC 4.9 was not found."
            exit 1
          fi

          chmod +x "$TOOLCHAIN/bin/"* || true

          echo
          echo "Compiler:"
          "$GCC" --version

          echo
          echo "Toolchain:"
          echo "$TOOLCHAIN"

          echo "ANDROID_GCC=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

      # ==========================================================
      # VERIFY GCC
      # ==========================================================

      - name: Verify GCC
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo " Verifying GCC"
          echo "=========================================="

          GCC="$ANDROID_GCC/bin/aarch64-linux-android-gcc"
          LD="$ANDROID_GCC/bin/aarch64-linux-android-ld"
          AS="$ANDROID_GCC/bin/aarch64-linux-android-as"

          test -f "$GCC"
          test -f "$LD"
          test -f "$AS"

          chmod +x "$GCC" "$LD" "$AS" || true

          echo
          "$GCC" --version

          echo
          "$LD" --version | head -1

          echo
          "$AS" --version | head -1

      # ==========================================================
      # FIND DEFCONFIG
      # ==========================================================

      - name: Find Camellian defconfig
        id: config
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo " Searching Camellian defconfig"
          echo "=========================================="

          CONFIG_DIR="arch/arm64/configs"

          if [ ! -d "$CONFIG_DIR" ]; then
            echo "::error::$CONFIG_DIR does not exist."
            exit 1
          fi

          echo
          echo "Available defconfigs:"

          find "$CONFIG_DIR" \
            -type f \
            -name '*defconfig' \
            | sort

          echo
          echo "Searching Camellian..."

          DEFCONFIG_FILE="$(
            find "$CONFIG_DIR" \
              -type f \
              \( \
                -iname '*camellian*defconfig' \
                -o \
                -iname '*camellia*defconfig' \
                -o \
                -iname '*mt6785*defconfig' \
              \) \
              | sort \
              | head -n 1
          )"

          if [ -z "$DEFCONFIG_FILE" ]; then

            echo
            echo "::error::No Camellian/MT6785 defconfig found."

            echo
            echo "Possible configs:"

            find "$CONFIG_DIR" \
              -type f \
              | grep -Ei \
                'vendor|mtk|mt6785|camellia|camellian' \
              | sort \
              || true

            exit 1
          fi

          DEFCONFIG="${DEFCONFIG_FILE#arch/arm64/configs/}"

          echo
          echo "Selected:"
          echo "$DEFCONFIG"

          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # PREPARE OUTPUT
      # ==========================================================

      - name: Prepare output
        shell: bash
        run: |
          set -eux

          rm -rf "$OUT_DIR"

          mkdir -p "$OUT_DIR"

      # ==========================================================
      # GENERATE DEFCONFIG
      # ==========================================================

      - name: Generate defconfig
        env:
          DEFCONFIG: ${{ steps.config.outputs.DEFCONFIG }}
        shell: bash
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$ANDROID_GCC/bin/aarch64-linux-android-"

          echo "=========================================="
          echo " Generating defconfig"
          echo "=========================================="

          echo "DEFCONFIG=$DEFCONFIG"
          echo "CROSS_COMPILE=$CROSS_COMPILE"

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            "$DEFCONFIG"

      # ==========================================================
      # CONFIG CHECK
      # ==========================================================

      - name: Verify kernel config
        shell: bash
        run: |
          set -eux

          CONFIG="$OUT_DIR/.config"

          echo "=========================================="
          echo " Kernel configuration"
          echo "=========================================="

          test -f "$CONFIG"

          echo
          echo "ARM64:"
          grep '^CONFIG_ARM64=' "$CONFIG" || true

          echo
          echo "MIHW:"
          grep '^CONFIG_MIHW=' "$CONFIG" || true

          echo
          echo "MILLET:"
          grep '^CONFIG_MILLET=' "$CONFIG" || true

          echo
          echo "Modules:"
          grep '^CONFIG_MODULES=' "$CONFIG" || true

          echo
          echo "MODVERSIONS:"
          grep '^CONFIG_MODVERSIONS=' "$CONFIG" || true

      # ==========================================================
      # COMPILER TEST
      # ==========================================================

      - name: Test compiler
        shell: bash
        run: |
          set -eux

          GCC="$ANDROID_GCC/bin/aarch64-linux-android-gcc"

          cat > /tmp/test.c <<'EOF'
          int test_function(const char *input)
          {
              char buffer[128];

              if (input)
                  buffer[0] = input[0];

              return 0;
          }
          EOF

          "$GCC" \
            -fstack-protector-strong \
            -c \
            /tmp/test.c \
            -o /tmp/test.o

          file /tmp/test.o

      # ==========================================================
      # BUILD KERNEL
      # ==========================================================

      - name: Build kernel
        shell: bash
        run: |
          set -o pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$ANDROID_GCC/bin/aarch64-linux-android-"

          echo "=========================================="
          echo " Building kernel"
          echo "=========================================="

          echo "Compiler:"
          "$ANDROID_GCC/bin/aarch64-linux-android-gcc" --version

          echo
          echo "CROSS_COMPILE:"
          echo "$CROSS_COMPILE"

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            2>&1 | tee kernel-build.log

      # ==========================================================
      # BUILD MODULES
      # ==========================================================

      - name: Build modules
        shell: bash
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$ANDROID_GCC/bin/aarch64-linux-android-"

          if grep -q '^CONFIG_MODULES=y' "$OUT_DIR/.config"; then

            echo "Building modules..."

            make \
              -j"$(nproc)" \
              O="$OUT_DIR" \
              ARCH="$ARCH" \
              SUBARCH="$SUBARCH" \
              CROSS_COMPILE="$CROSS_COMPILE" \
              modules

          else

            echo "CONFIG_MODULES is disabled."

          fi

      # ==========================================================
      # BUILD DTBS
      # ==========================================================

      - name: Build DTBs
        shell: bash
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$ANDROID_GCC/bin/aarch64-linux-android-"

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            dtbs

      # ==========================================================
      # INSTALL MODULES
      # ==========================================================

      - name: Install modules
        shell: bash
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$ANDROID_GCC/bin/aarch64-linux-android-"

          if grep -q '^CONFIG_MODULES=y' "$OUT_DIR/.config"; then

            rm -rf "$OUT_DIR/modules"

            mkdir -p "$OUT_DIR/modules"

            make \
              O="$OUT_DIR" \
              ARCH="$ARCH" \
              SUBARCH="$SUBARCH" \
              CROSS_COMPILE="$CROSS_COMPILE" \
              modules_install \
              INSTALL_MOD_PATH="$GITHUB_WORKSPACE/$OUT_DIR/modules"

          else

            echo "CONFIG_MODULES is disabled."

          fi

      # ==========================================================
      # COLLECT OUTPUT
      # ==========================================================

      - name: Collect kernel files
        shell: bash
        run: |
          set -eux

          rm -rf release

          mkdir -p \
            release \
            release/dtb \
            release/dtbo \
            release/modules

          BOOT="$OUT_DIR/arch/arm64/boot"

          echo "=========================================="
          echo " Kernel images"
          echo "=========================================="

          for IMAGE in \
            Image \
            Image.gz \
            Image.lz4 \
            Image.gz-dtb \
            Image-dtb
          do
            if [ -f "$BOOT/$IMAGE" ]; then
              echo "Found: $IMAGE"
              cp "$BOOT/$IMAGE" "release/$IMAGE"
            fi
          done

          echo
          echo "DTBs:"

          find "$BOOT" \
            -type f \
            -name '*.dtb' \
            -exec cp {} release/dtb/ \; \
            || true

          echo
          echo "DTBOs:"

          find "$BOOT" \
            -type f \
            -name '*.dtbo' \
            -exec cp {} release/dtbo/ \; \
            || true

          echo
          echo "Modules:"

          find "$OUT_DIR" \
            -type f \
            -name '*.ko' \
            -exec cp {} release/modules/ \; \
            || true

          echo
          echo "Release files:"

          find release \
            -type f \
            | sort

      # ==========================================================
      # VALIDATE OUTPUT
      # ==========================================================

      - name: Validate kernel
        shell: bash
        run: |
          set -eux

          FOUND=0

          for IMAGE in \
            release/Image \
            release/Image.gz \
            release/Image.lz4 \
            release/Image.gz-dtb \
            release/Image-dtb
          do
            if [ -f "$IMAGE" ]; then
              echo "Kernel found: $IMAGE"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "::error::No kernel image was produced."

            find "$OUT_DIR/arch/arm64/boot" \
              -maxdepth 2 \
              -type f \
              | sort \
              || true

            exit 1
          fi

      # ==========================================================
      # MODULES.LOAD
      # ==========================================================

      - name: Generate modules.load
        shell: bash
        run: |
          set -eux

          : > release/modules.load

          find release/modules \
            -maxdepth 1 \
            -type f \
            -name '*.ko' \
            -printf '%f\n' \
            | sort \
            > release/modules.load

          echo
          cat release/modules.load

      # ==========================================================
      # BUILD INFO
      # ==========================================================

      - name: Generate build information
        env:
          DEFCONFIG: ${{ steps.config.outputs.DEFCONFIG }}
        shell: bash
        run: |
          set -eux

          KERNEL_VERSION="$(
            make \
              O="$OUT_DIR" \
              ARCH=arm64 \
              kernelversion \
              2>/dev/null \
              || echo unknown
          )"

          cat > release/build-info.txt <<EOF
          ==========================================
          Xiaomi Camellian Kernel
          ==========================================

          Devices:
          POCO M3 Pro 5G
          Redmi Note 10 5G
          Redmi Note 10T

          Codename:
          camellian

          SoC:
          MediaTek MT6785

          Android:
          Android T

          Kernel repository:
          MiCode/Xiaomi_Kernel_OpenSource

          Kernel branch:
          camellian-t-oss

          Kernel commit:
          $(git rev-parse HEAD)

          Module repository:
          MiCode/MTK_kernel_modules

          Module branch:
          camellian-t-oss

          Module commit:
          $(git -C vendor/xiaomi/kernel_modules rev-parse HEAD)

          Kernel version:
          $KERNEL_VERSION

          Architecture:
          arm64

          Defconfig:
          $DEFCONFIG

          Compiler:
          AArch64 Android GCC 4.9

          Build date:
          $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ==========================================
          EOF

          cat release/build-info.txt

      # ==========================================================
      # PACKAGE
      # ==========================================================

      - name: Package kernel
        shell: bash
        run: |
          set -eux

          ZIP_NAME="camellian-kernel-${GITHUB_SHA::7}.zip"

          cd release

          zip \
            -r \
            "../$ZIP_NAME" \
            . \
            >/dev/null

          cd ..

          ls -lh "$ZIP_NAME"

      # ==========================================================
      # UPLOAD
      # ==========================================================

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: camellian-kernel
          path: |
            camellian-kernel-*.zip
            release/
            kernel-build.log
          if-no-files-found: error
          compression-level: 6
