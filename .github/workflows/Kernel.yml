```yaml
name: Build Xiaomi Camellian Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  KERNEL_BRANCH: camellian-t-oss
  OUT_DIR: out

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ---------------------------------------------------------
      # Checkout kernel source
      # ---------------------------------------------------------

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: camellian-t-oss
          fetch-depth: 1

      # ---------------------------------------------------------
      # Install dependencies
      # ---------------------------------------------------------

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            clang \
            llvm \
            lld \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            device-tree-compiler \
            cpio \
            rsync \
            python3 \
            python3-pip \
            git \
            wget \
            curl \
            zip \
            unzip \
            zstd \
            lz4 \
            lzop

      # ---------------------------------------------------------
      # Show source information
      # ---------------------------------------------------------

      - name: Show kernel information
        run: |
          echo "=========================================="
          echo " Xiaomi Camellian Kernel"
          echo " Branch: ${KERNEL_BRANCH}"
          echo " ARCH:   ${ARCH}"
          echo "=========================================="

          git log -1 --oneline

          echo
          echo "Kernel version:"
          make kernelversion || true

      # ---------------------------------------------------------
      # Find defconfig
      # ---------------------------------------------------------

      - name: Find defconfig
        id: defconfig
        shell: bash
        run: |

          echo "Searching for Camellian defconfig..."

          DEFCONFIG=""

          # Search exact camellian names first
          for file in $(find arch/arm64/configs -type f \
            \( -iname "*camellian*defconfig" \
            -o -iname "*camellian*_defconfig" \) 2>/dev/null); do

            DEFCONFIG=$(basename "$file")
            break
          done

          # Fallback: search all defconfig files
          if [ -z "$DEFCONFIG" ]; then

            echo "Camellian-specific defconfig not found."
            echo "Available defconfigs:"

            find arch/arm64/configs -type f \
              -name "*defconfig" | sort

            DEFCONFIG=$(find arch/arm64/configs \
              -type f \
              -name "*defconfig" \
              | head -n 1 \
              | xargs -r basename)

          fi

          if [ -z "$DEFCONFIG" ]; then
            echo "ERROR: No defconfig found."
            exit 1
          fi

          echo "Using defconfig: $DEFCONFIG"

          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # Prepare output
      # ---------------------------------------------------------

      - name: Prepare build
        run: |
          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"

      # ---------------------------------------------------------
      # Generate defconfig
      # ---------------------------------------------------------

      - name: Generate defconfig
        env:
          DEFCONFIG: ${{ steps.defconfig.outputs.DEFCONFIG }}
        run: |
          echo "Using:"
          echo "  ARCH=${ARCH}"
          echo "  SUBARCH=${SUBARCH}"
          echo "  DEFCONFIG=${DEFCONFIG}"

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            SUBARCH="${SUBARCH}" \
            "${DEFCONFIG}"

      # ---------------------------------------------------------
      # Show resulting configuration
      # ---------------------------------------------------------

      - name: Check kernel configuration
        run: |
          echo "CONFIGURATION:"
          echo "=========================================="

          grep -E \
            'CONFIG_MODULES=|CONFIG_MODVERSIONS=|CONFIG_ARM64=|CONFIG_CC_IS_CLANG=|CONFIG_LTO_' \
            "${OUT_DIR}/.config" || true

      # ---------------------------------------------------------
      # Build kernel
      # ---------------------------------------------------------

      - name: Build kernel
        run: |

          echo "Starting kernel build..."

          make \
            -j"$(nproc)" \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            SUBARCH="${SUBARCH}" \
            LLVM=1 \
            LLVM_IAS=1

      # ---------------------------------------------------------
      # Build modules
      # ---------------------------------------------------------

      - name: Build kernel modules
        run: |

          if grep -q '^CONFIG_MODULES=y' "${OUT_DIR}/.config"; then

            echo "Building modules..."

            make \
              -j"$(nproc)" \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              SUBARCH="${SUBARCH}" \
              LLVM=1 \
              LLVM_IAS=1 \
              modules

          else

            echo "CONFIG_MODULES is disabled."
            echo "Skipping modules."

          fi

      # ---------------------------------------------------------
      # Install modules
      # ---------------------------------------------------------

      - name: Install modules
        run: |

          if grep -q '^CONFIG_MODULES=y' "${OUT_DIR}/.config"; then

            mkdir -p "${OUT_DIR}/modules"

            make \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              SUBARCH="${SUBARCH}" \
              modules_install \
              INSTALL_MOD_PATH="${OUT_DIR}/modules"

          fi

      # ---------------------------------------------------------
      # Build DTBs
      # ---------------------------------------------------------

      - name: Build DTBs
        run: |

          make \
            -j"$(nproc)" \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            SUBARCH="${SUBARCH}" \
            LLVM=1 \
            LLVM_IAS=1 \
            dtbs || true

      # ---------------------------------------------------------
      # Collect kernel
      # ---------------------------------------------------------

      - name: Collect kernel output
        run: |

          mkdir -p release

          echo "Searching kernel images..."

          find "${OUT_DIR}/arch/arm64/boot" \
            -maxdepth 2 \
            -type f \
            -exec cp --parents {} release/ \; \
            || true

          echo
          echo "Kernel output:"
          find "${OUT_DIR}/arch/arm64/boot" \
            -maxdepth 3 \
            -type f \
            -print \
            || true

      # ---------------------------------------------------------
      # Collect modules
      # ---------------------------------------------------------

      - name: Collect modules
        run: |

          mkdir -p release/modules

          if [ -d "${OUT_DIR}/modules/lib/modules" ]; then

            cp -a \
              "${OUT_DIR}/modules/lib/modules/." \
              release/modules/

          fi

          find "${OUT_DIR}" \
            -type f \
            -name "*.ko" \
            -exec cp --parents {} release/modules/ \; \
            || true

      # ---------------------------------------------------------
      # Create modules.load
      # ---------------------------------------------------------

      - name: Generate modules.load
        run: |

          find release/modules \
            -type f \
            -name "*.ko" \
            -printf "%f\n" \
            | sort \
            > release/modules.load

          echo
          echo "modules.load:"
          cat release/modules.load || true

      # ---------------------------------------------------------
      # Kernel information
      # ---------------------------------------------------------

      - name: Generate build information
        run: |

          cat > release/build-info.txt <<EOF
          Xiaomi Kernel OpenSource

          Repository:
          https://github.com/MiCode/Xiaomi_Kernel_OpenSource

          Branch:
          ${KERNEL_BRANCH}

          Commit:
          $(git rev-parse HEAD)

          Commit short:
          $(git rev-parse --short HEAD)

          Kernel version:
          $(make kernelversion 2>/dev/null || echo unknown)

          Architecture:
          ${ARCH}

          Defconfig:
          ${{ steps.defconfig.outputs.DEFCONFIG }}

          Compiler:
          $(clang --version | head -n 1)

          Build date:
          $(date -u)
          EOF

          cat release/build-info.txt

      # ---------------------------------------------------------
      # Package
      # ---------------------------------------------------------

      - name: Create kernel zip
        run: |

          cd release

          zip -r \
            ../camellian-kernel-${GITHUB_SHA::7}.zip \
            . \
            >/dev/null

          cd ..

          ls -lh camellian-kernel-*.zip

      # ---------------------------------------------------------
      # Upload artifact
      # ---------------------------------------------------------

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: camellian-kernel
          path: |
            camellian-kernel-*.zip
            release/build-info.txt
            release/modules.load
          if-no-files-found: error

      # ---------------------------------------------------------
      # Upload raw kernel
      # ---------------------------------------------------------

      - name: Upload raw kernel
        uses: actions/upload-artifact@v4
        with:
          name: camellian-kernel-raw
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/**/*.dtb
            out/arch/arm64/boot/dts/**/*.dtbo
          if-no-files-found: warn
```
