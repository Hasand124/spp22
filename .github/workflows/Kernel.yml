name: Build Camellian Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  DEFCONFIG: camellian_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # Checkout
      # =========================================================

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: camellian-t-oss
          fetch-depth: 1

      # =========================================================
      # Dependencies
      # =========================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            device-tree-compiler \
            cpio \
            rsync \
            python3 \
            git \
            wget \
            curl \
            zip \
            unzip \
            lz4 \
            lzop \
            zstd

      # =========================================================
      # Download Android GCC 4.9
      # =========================================================

      - name: Download Android GCC 4.9
        run: |
          mkdir -p toolchain

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchain/aarch64-linux-android-4.9

          echo "GCC toolchain:"
          ls -la toolchain/aarch64-linux-android-4.9/bin

      # =========================================================
      # Download ARM32 GCC
      # =========================================================

      - name: Download ARM32 GCC 4.9
        run: |
          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            toolchain/arm-linux-androideabi-4.9

          echo "ARM32 toolchain:"
          ls -la toolchain/arm-linux-androideabi-4.9/bin

      # =========================================================
      # Setup toolchain
      # =========================================================

      - name: Setup toolchain
        run: |

          echo "=========================================="
          echo "Setting up Android GCC toolchain"
          echo "=========================================="

          GCC64="$GITHUB_WORKSPACE/toolchain/aarch64-linux-android-4.9/bin"
          GCC32="$GITHUB_WORKSPACE/toolchain/arm-linux-androideabi-4.9/bin"

          echo "$GCC64" >> "$GITHUB_PATH"
          echo "$GCC32" >> "$GITHUB_PATH"

          echo "PATH=$GCC64:$GCC32:\$PATH"

          echo
          echo "GCC64:"
          "$GCC64/aarch64-linux-android-gcc" --version

          echo
          echo "GCC32:"
          "$GCC32/arm-linux-androideabi-gcc" --version

      # =========================================================
      # Find defconfig
      # =========================================================

      - name: Find defconfig
        id: config
        shell: bash
        run: |

          echo "Searching defconfig..."

          echo
          echo "Available defconfigs:"
          find arch/arm64/configs \
            -type f \
            -name "*defconfig" \
            | sort

          DEFCONFIG_FILE=""

          for f in $(find arch/arm64/configs \
            -type f \
            -iname "*camellian*defconfig"); do

            DEFCONFIG_FILE="$f"
            break

          done

          if [ -z "$DEFCONFIG_FILE" ]; then

            echo
            echo "Camellian defconfig not found."

            echo "Trying camellian_gl_defconfig..."

            if [ -f arch/arm64/configs/camellian_gl_defconfig ]; then
              DEFCONFIG="camellian_gl_defconfig"

            elif [ -f arch/arm64/configs/camellian_defconfig ]; then
              DEFCONFIG="camellian_defconfig"

            else
              echo "ERROR: No Camellian defconfig found."
              exit 1
            fi

          else

            DEFCONFIG=$(basename "$DEFCONFIG_FILE")

          fi

          echo
          echo "Selected:"
          echo "$DEFCONFIG"

          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_OUTPUT"

      # =========================================================
      # Clean
      # =========================================================

      - name: Clean output
        run: |
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

      # =========================================================
      # Generate defconfig
      # =========================================================

      - name: Generate defconfig
        env:
          DEFCONFIG: ${{ steps.config.outputs.DEFCONFIG }}
        run: |

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchain/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-"

          export CLANG_TRIPLE="aarch64-linux-gnu-"

          echo "=========================================="
          echo "Generating defconfig"
          echo "=========================================="

          echo "ARCH=$ARCH"
          echo "SUBARCH=$SUBARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"
          echo "DEFCONFIG=$DEFCONFIG"

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            "$DEFCONFIG"

      # =========================================================
      # Verify compiler
      # =========================================================

      - name: Verify compiler
        run: |

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-"

          echo "Checking:"
          command -v "${CROSS_COMPILE}gcc"

          echo
          "${CROSS_COMPILE}gcc" --version

          echo
          echo "Compiler test:"

          cat > /tmp/test.c <<'EOF'
          int main(void)
          {
              return 0;
          }
          EOF

          "${CROSS_COMPILE}gcc" \
            -fstack-protector-strong \
            -c /tmp/test.c \
            -o /tmp/test.o

          echo "Compiler stack protector test: OK"

      # =========================================================
      # Build kernel
      # =========================================================

      - name: Build kernel
        run: |

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-"

          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchain/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-"

          export CLANG_TRIPLE="aarch64-linux-gnu-"

          echo "=========================================="
          echo "BUILDING KERNEL"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE"

      # =========================================================
      # Build modules
      # =========================================================

      - name: Build modules
        run: |

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-"

          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchain/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-"

          if grep -q '^CONFIG_MODULES=y' "$OUT_DIR/.config"; then

            echo "Building modules..."

            make \
              -j"$(nproc)" \
              O="$OUT_DIR" \
              ARCH="$ARCH" \
              SUBARCH="$SUBARCH" \
              CROSS_COMPILE="$CROSS_COMPILE" \
              CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
              modules

          else

            echo "CONFIG_MODULES is disabled."

          fi

      # =========================================================
      # Install modules
      # =========================================================

      - name: Install modules
        run: |

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-"

          if grep -q '^CONFIG_MODULES=y' "$OUT_DIR/.config"; then

            mkdir -p "$OUT_DIR/modules"

            make \
              O="$OUT_DIR" \
              ARCH="$ARCH" \
              SUBARCH="$SUBARCH" \
              CROSS_COMPILE="$CROSS_COMPILE" \
              modules_install \
              INSTALL_MOD_PATH="$GITHUB_WORKSPACE/$OUT_DIR/modules"

          fi

      # =========================================================
      # Build DTB
      # =========================================================

      - name: Build DTB
        run: |

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-"

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            dtbs || true

      # =========================================================
      # Collect output
      # =========================================================

      - name: Collect output
        run: |

          mkdir -p release

          echo "=========================================="
          echo "Kernel output"
          echo "=========================================="

          find "$OUT_DIR/arch/arm64/boot" \
            -maxdepth 3 \
            -type f \
            -print \
            || true

          echo
          echo "Copying kernel..."

          cp "$OUT_DIR/arch/arm64/boot/Image" \
            release/Image \
            2>/dev/null || true

          cp "$OUT_DIR/arch/arm64/boot/Image.gz" \
            release/Image.gz \
            2>/dev/null || true

          cp "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" \
            release/Image.gz-dtb \
            2>/dev/null || true

      # =========================================================
      # Collect DTB / DTBO
      # =========================================================

      - name: Collect DTB and DTBO
        run: |

          mkdir -p release/dtb

          find "$OUT_DIR/arch/arm64/boot" \
            -type f \
            \( \
              -name "*.dtb" \
              -o \
              -name "*.dtbo" \
            \) \
            -exec cp {} release/dtb/ \; \
            || true

      # =========================================================
      # Collect modules
      # =========================================================

      - name: Collect modules
        run: |

          mkdir -p release/modules

          find "$OUT_DIR" \
            -type f \
            -name "*.ko" \
            -exec cp {} release/modules/ \;

          echo
          echo "Kernel modules:"
          find release/modules \
            -type f \
            -name "*.ko" \
            | sort

      # =========================================================
      # Generate modules.load
      # =========================================================

      - name: Generate modules.load
        run: |

          find release/modules \
            -type f \
            -name "*.ko" \
            -printf "%f\n" \
            | sort \
            > release/modules.load

          echo
          echo "modules.load:"
          cat release/modules.load

      # =========================================================
      # Build information
      # =========================================================

      - name: Build information
        run: |

          cat > release/build-info.txt <<EOF
          Device:
          POCO M3 Pro 5G / Redmi Note 10 5G / Redmi Note 10T

          Codename:
          camellian

          Repository:
          MiCode/Xiaomi_Kernel_OpenSource

          Branch:
          camellian-t-oss

          Commit:
          $(git rev-parse HEAD)

          Kernel:
          $(make kernelversion 2>/dev/null || echo unknown)

          Architecture:
          arm64

          Defconfig:
          ${{ steps.config.outputs.DEFCONFIG }}

          Toolchain:
          Android GCC 4.9

          Build date:
          $(date -u)
          EOF

          cat release/build-info.txt

      # =========================================================
      # Create ZIP
      # =========================================================

      - name: Package kernel
        run: |

          cd release

          zip -r \
            "../camellian-kernel-${GITHUB_SHA::7}.zip" \
            . \
            >/dev/null

          cd ..

          ls -lh camellian-kernel-*.zip

      # =========================================================
      # Upload artifact
      # =========================================================

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: camellian-kernel
          path: |
            camellian-kernel-*.zip
            release/
          if-no-files-found: error
