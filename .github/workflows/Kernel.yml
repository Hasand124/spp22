name: Build Camellian Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: camellian-t-oss
          fetch-depth: 1

      # =========================================================
      # DEPENDENCIES
      # =========================================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            device-tree-compiler \
            cpio \
            rsync \
            python3 \
            git \
            wget \
            curl \
            unzip \
            zip \
            lz4 \
            lzop \
            zstd

      # =========================================================
      # DOWNLOAD GCC 4.9
      # =========================================================

      - name: Download Android GCC 4.9
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/toolchain"

          cd "$GITHUB_WORKSPACE/toolchain"

          echo "=========================================="
          echo " Downloading AArch64 GCC 4.9"
          echo "=========================================="

          wget -q --show-progress \
            https://releases.linaro.org/archive/15.11/components/toolchain/binaries/aarch64-linux-gnu/gcc-linaro-5.2-2015.11-2-x86_64_aarch64-linux-gnu.tar.xz \
            -O gcc.tar.xz

          tar -xf gcc.tar.xz

          GCC_DIR=$(find "$GITHUB_WORKSPACE/toolchain" \
            -maxdepth 1 \
            -type d \
            -name "gcc-linaro-*" \
            | head -n 1)

          if [ -z "$GCC_DIR" ]; then
            echo "ERROR: GCC directory not found"
            exit 1
          fi

          echo "Found:"
          echo "$GCC_DIR"

          echo "GCC_DIR=$GCC_DIR" >> "$GITHUB_ENV"

          echo
          echo "Toolchain binaries:"
          find "$GCC_DIR/bin" \
            -maxdepth 1 \
            -type f \
            | sort

      # =========================================================
      # DOWNLOAD ANDROID GCC 4.9 PREBUILT
      # =========================================================

      - name: Download Android GCC prebuilt
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/toolchain/android-gcc"

          cd "$GITHUB_WORKSPACE/toolchain/android-gcc"

          echo "Downloading Android GCC prebuilt..."

          git clone \
            --depth=1 \
            --filter=blob:none \
            --no-checkout \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            source

          cd source

          # Fetch an old revision containing the actual binaries.
          git fetch --depth=1 \
            origin \
            a7bb6f39cd99b2fb26ecc2d3cb984d18cd259d24

          git checkout \
            a7bb6f39cd99b2fb26ecc2d3cb984d18cd259d24

          echo
          echo "Checking Android GCC..."

          if [ ! -f "bin/aarch64-linux-android-gcc" ]; then

            echo "ERROR: Android GCC binary is missing."

            echo
            echo "Available gcc files:"
            find . \
              -type f \
              -name "*gcc*" \
              | sort

            exit 1
          fi

          chmod +x bin/* || true

          echo
          echo "Android GCC:"
          bin/aarch64-linux-android-gcc --version

          echo "ANDROID_GCC=$GITHUB_WORKSPACE/toolchain/android-gcc/source" >> "$GITHUB_ENV"

      # =========================================================
      # SET PATH
      # =========================================================

      - name: Setup toolchain
        shell: bash
        run: |
          set -e

          echo "$ANDROID_GCC/bin" >> "$GITHUB_PATH"

          echo
          echo "=========================================="
          echo " Toolchain"
          echo "=========================================="

          ls -lh "$ANDROID_GCC/bin/aarch64-linux-android-gcc"

          echo
          command -v aarch64-linux-android-gcc

          echo
          aarch64-linux-android-gcc --version

      # =========================================================
      # FIND DEFCONFIG
      # =========================================================

      - name: Find defconfig
        id: defconfig
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " Searching Camellian defconfig"
          echo "=========================================="

          find arch/arm64/configs \
            -type f \
            -name "*defconfig" \
            | sort

          DEFCONFIG_FILE=$(find arch/arm64/configs \
            -type f \
            -iname "*camellian*defconfig" \
            | sort \
            | head -n 1)

          if [ -z "$DEFCONFIG_FILE" ]; then
            echo
            echo "ERROR: Camellian defconfig not found."
            exit 1
          fi

          DEFCONFIG=$(basename "$DEFCONFIG_FILE")

          echo
          echo "Using:"
          echo "$DEFCONFIG"

          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_OUTPUT"

      # =========================================================
      # PREPARE
      # =========================================================

      - name: Prepare output
        run: |
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

      # =========================================================
      # DEFCONFIG
      # =========================================================

      - name: Generate defconfig
        env:
          DEFCONFIG: ${{ steps.defconfig.outputs.DEFCONFIG }}
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="$ANDROID_GCC/bin/aarch64-linux-android-"

          echo "=========================================="
          echo " DEFCONFIG"
          echo "=========================================="

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            "$DEFCONFIG"

      # =========================================================
      # CONFIG CHECK
      # =========================================================

      - name: Check configuration
        run: |

          echo "=========================================="
          echo " CONFIG"
          echo "=========================================="

          test -f "$OUT_DIR/.config"

          grep -E \
            'CONFIG_ARM64=|CONFIG_MODULES=|CONFIG_MODVERSIONS=|CONFIG_CC_STACKPROTECTOR' \
            "$OUT_DIR/.config" \
            || true

      # =========================================================
      # COMPILER CHECK
      # =========================================================

      - name: Compiler check
        shell: bash
        run: |
          set -e

          export CROSS_COMPILE="$ANDROID_GCC/bin/aarch64-linux-android-"

          echo "Compiler:"
          "${CROSS_COMPILE}gcc" --version

          echo
          echo "Testing -fstack-protector-strong..."

          cat > /tmp/test.c <<'EOF'
          int test(const char *x)
          {
              char buffer[64];

              if (x)
                  buffer[0] = x[0];

              return 0;
          }
          EOF

          "${CROSS_COMPILE}gcc" \
            -fstack-protector-strong \
            -c /tmp/test.c \
            -o /tmp/test.o

          echo
          echo "Compiler test: OK"

      # =========================================================
      # BUILD KERNEL
      # =========================================================

      - name: Build kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="$ANDROID_GCC/bin/aarch64-linux-android-"

          echo "=========================================="
          echo " BUILD KERNEL"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE"

      # =========================================================
      # BUILD MODULES
      # =========================================================

      - name: Build modules
        shell: bash
        run: |

          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="$ANDROID_GCC/bin/aarch64-linux-android-"

          if grep -q '^CONFIG_MODULES=y' "$OUT_DIR/.config"; then

            make \
              -j"$(nproc)" \
              O="$OUT_DIR" \
              ARCH="$ARCH" \
              SUBARCH="$SUBARCH" \
              CROSS_COMPILE="$CROSS_COMPILE" \
              modules

          else

            echo "CONFIG_MODULES is disabled."

          fi

      # =========================================================
      # INSTALL MODULES
      # =========================================================

      - name: Install modules
        shell: bash
        run: |

          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="$ANDROID_GCC/bin/aarch64-linux-android-"

          if grep -q '^CONFIG_MODULES=y' "$OUT_DIR/.config"; then

            mkdir -p "$OUT_DIR/modules"

            make \
              O="$OUT_DIR" \
              ARCH="$ARCH" \
              SUBARCH="$SUBARCH" \
              CROSS_COMPILE="$CROSS_COMPILE" \
              modules_install \
              INSTALL_MOD_PATH="$GITHUB_WORKSPACE/$OUT_DIR/modules"

          fi

      # =========================================================
      # DTB
      # =========================================================

      - name: Build DTBs
        shell: bash
        run: |

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="$ANDROID_GCC/bin/aarch64-linux-android-"

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            dtbs || true

      # =========================================================
      # COLLECT
      # =========================================================

      - name: Collect kernel
        shell: bash
        run: |

          set -e

          rm -rf release

          mkdir -p release
          mkdir -p release/dtb
          mkdir -p release/modules

          BOOT="$OUT_DIR/arch/arm64/boot"

          for file in \
            Image \
            Image.gz \
            Image.lz4 \
            Image.gz-dtb
          do

            if [ -f "$BOOT/$file" ]; then
              cp "$BOOT/$file" "release/$file"
            fi

          done

          # DTB
          find "$BOOT" \
            -type f \
            -name "*.dtb" \
            -exec cp {} release/dtb/ \; \
            || true

          # DTBO
          find "$BOOT" \
            -type f \
            -name "*.dtbo" \
            -exec cp {} release/dtb/ \; \
            || true

          # Modules
          find "$OUT_DIR" \
            -type f \
            -name "*.ko" \
            -exec cp {} release/modules/ \; \
            || true

          echo
          echo "=========================================="
          echo " RELEASE"
          echo "=========================================="

          find release \
            -type f \
            | sort

      # =========================================================
      # MODULES.LOAD
      # =========================================================

      - name: Generate modules.load
        shell: bash
        run: |

          find release/modules \
            -type f \
            -name "*.ko" \
            -printf "%f\n" \
            | sort \
            > release/modules.load

          echo
          echo "modules.load:"
          cat release/modules.load

      # =========================================================
      # BUILD INFO
      # =========================================================

      - name: Generate build information
        env:
          DEFCONFIG: ${{ steps.defconfig.outputs.DEFCONFIG }}
        run: |

          cat > release/build-info.txt <<EOF
          Device:
          POCO M3 Pro 5G
          Redmi Note 10 5G
          Redmi Note 10T

          Codename:
          camellian

          Platform:
          MediaTek MT6785

          Android:
          Android T

          Repository:
          MiCode/Xiaomi_Kernel_OpenSource

          Branch:
          camellian-t-oss

          Commit:
          $(git rev-parse HEAD)

          Kernel:
          $(make kernelversion 2>/dev/null || echo unknown)

          Architecture:
          arm64

          Defconfig:
          ${DEFCONFIG}

          Compiler:
          Android GCC 4.9

          Build date:
          $(date -u)
          EOF

      # =========================================================
      # ZIP
      # =========================================================

      - name: Package kernel
        shell: bash
        run: |

          set -e

          ZIP="camellian-kernel-${GITHUB_SHA::7}.zip"

          cd release

          zip -r "../$ZIP" . >/dev/null

          cd ..

          echo "Created:"
          ls -lh "$ZIP"

      # =========================================================
      # ARTIFACT
      # =========================================================

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: camellian-kernel
          path: |
            camellian-kernel-*.zip
            release/
          if-no-files-found: error


