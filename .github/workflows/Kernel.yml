name: Build Xiaomi Camellian Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  TOOLCHAIN_DIR: toolchain/aarch64-linux-android-4.9

jobs:
  build:
    name: Build camellian-t-oss
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout Xiaomi kernel
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: camellian-t-oss
          fetch-depth: 1
          submodules: recursive

      # ==========================================================
      # SYSTEM INFORMATION
      # ==========================================================

      - name: System information
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo " System"
          echo "=========================================="

          uname -a
          lsb_release -a || true

          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h .

          echo
          echo "Git:"
          git --version

      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lz4 \
            lzop \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip \
            zstd

      # ==========================================================
      # SOURCE INFORMATION
      # ==========================================================

      - name: Inspect kernel source
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo " Kernel source"
          echo "=========================================="

          echo "Repository:"
          git remote get-url origin

          echo
          echo "Branch:"
          git branch --show-current || true

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Kernel version:"
          grep -E \
            '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' \
            Makefile || true

          echo
          echo "Submodules:"
          git submodule status || true

      # ==========================================================
      # GCC 4.9
      # ==========================================================

      - name: Download Android GCC 4.9
        shell: bash
        run: |
          set -eux

          TOOLCHAIN="$GITHUB_WORKSPACE/$TOOLCHAIN_DIR"

          echo "=========================================="
          echo " Android GCC 4.9"
          echo "=========================================="

          rm -rf "$TOOLCHAIN"

          mkdir -p "$(dirname "$TOOLCHAIN")"

          git clone \
            --depth=1 \
            --branch ndk-release-r18 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$TOOLCHAIN"

          GCC="$TOOLCHAIN/bin/aarch64-linux-android-gcc"

          if [ ! -x "$GCC" ]; then
            chmod +x "$TOOLCHAIN/bin/"* || true
          fi

          test -f "$GCC"

          echo
          echo "Compiler:"
          "$GCC" --version

          echo
          echo "Toolchain:"
          echo "$TOOLCHAIN"

          echo "ANDROID_GCC=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

      # ==========================================================
      # VERIFY TOOLCHAIN
      # ==========================================================

      - name: Verify toolchain
        shell: bash
        run: |
          set -eux

          GCC="$ANDROID_GCC/bin/aarch64-linux-android-gcc"
          LD="$ANDROID_GCC/bin/aarch64-linux-android-ld"
          AS="$ANDROID_GCC/bin/aarch64-linux-android-as"

          echo "=========================================="
          echo " Verifying toolchain"
          echo "=========================================="

          test -f "$GCC"
          test -f "$LD"
          test -f "$AS"

          chmod +x "$GCC" "$LD" "$AS" || true

          "$GCC" --version
          "$LD" --version | head -1
          "$AS" --version | head -1

      # ==========================================================
      # FIND MIHW DEPENDENCY
      # ==========================================================

      - name: Check Xiaomi MIHW dependency
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo " Checking MIHW dependency"
          echo "=========================================="

          TARGET="vendor/xiaomi/kernel_modules/mihw/millet/Makefile"

          echo "Expected:"
          echo "$TARGET"

          echo
          echo "Checking file..."

          if [ -f "$TARGET" ]; then
            echo "MIHW Makefile found."
          else
            echo "::warning::MIHW Makefile is missing."

            echo
            echo "Searching Xiaomi vendor tree:"
            find vendor \
              -maxdepth 8 \
              -type f \
              2>/dev/null \
              | grep -Ei \
                'mihw|millet|kernel_modules|xiaomi' \
              | sort \
              | head -500 \
              || true

            echo
            echo "Searching all MIHW references:"
            grep -RIn \
              --exclude-dir=.git \
              -E \
              'mihw|millet|kernel_modules' \
              . \
              2>/dev/null \
              | head -500 \
              || true

            echo
            echo "Git submodules:"
            git submodule status || true

            echo
            echo "::error::Required Xiaomi MIHW source is missing."
            echo "::error::Expected: $TARGET"

            exit 1
          fi

      # ==========================================================
      # FIND DEFCONFIG
      # ==========================================================

      - name: Find Camellian defconfig
        id: config
        shell: bash
        run: |
          set -eux

          CONFIG_DIR="arch/arm64/configs"

          echo "=========================================="
          echo " Searching defconfig"
          echo "=========================================="

          test -d "$CONFIG_DIR"

          echo
          echo "Available defconfigs:"
          find "$CONFIG_DIR" \
            -type f \
            -name '*defconfig' \
            | sort

          echo
          echo "Camellian candidates:"

          find "$CONFIG_DIR" \
            -type f \
            \( \
              -iname '*camellian*defconfig' \
              -o -iname '*camellia*defconfig' \
              -o -iname '*mt6785*defconfig' \
              -o -iname '*mt6768*defconfig' \
            \) \
            | sort \
            | tee /tmp/camellian-defconfigs.txt

          DEFCONFIG_FILE="$(
            head -n 1 /tmp/camellian-defconfigs.txt
          )"

          if [ -z "$DEFCONFIG_FILE" ]; then
            echo
            echo "::error::No Camellian/MT6785 defconfig found."
            exit 1
          fi

          DEFCONFIG="${DEFCONFIG_FILE#arch/arm64/configs/}"

          echo
          echo "Selected defconfig:"
          echo "$DEFCONFIG"

          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # PREPARE OUTPUT
      # ==========================================================

      - name: Prepare output
        shell: bash
        run: |
          set -eux

          rm -rf "$OUT_DIR"

          mkdir -p "$OUT_DIR"

      # ==========================================================
      # GENERATE DEFCONFIG
      # ==========================================================

      - name: Generate defconfig
        env:
          DEFCONFIG: ${{ steps.config.outputs.DEFCONFIG }}
        shell: bash
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$ANDROID_GCC/bin/aarch64-linux-android-"

          echo "=========================================="
          echo " Generating defconfig"
          echo "=========================================="

          echo "DEFCONFIG=$DEFCONFIG"
          echo "CROSS_COMPILE=$CROSS_COMPILE"

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            "$DEFCONFIG"

      # ==========================================================
      # CHECK CONFIG
      # ==========================================================

      - name: Verify configuration
        shell: bash
        run: |
          set -eux

          CONFIG="$OUT_DIR/.config"

          echo "=========================================="
          echo " Kernel configuration"
          echo "=========================================="

          test -f "$CONFIG"

          echo
          echo "ARM64:"
          grep '^CONFIG_ARM64=' "$CONFIG" || true

          echo
          echo "Modules:"
          grep '^CONFIG_MODULES=' "$CONFIG" || true

          echo
          echo "MODVERSIONS:"
          grep '^CONFIG_MODVERSIONS=' "$CONFIG" || true

          echo
          echo "Stack protector:"
          grep '^CONFIG_CC_STACKPROTECTOR' "$CONFIG" || true

          echo
          echo "Clang:"
          grep '^CONFIG_CC_IS_CLANG=' "$CONFIG" || true

      # ==========================================================
      # COMPILER TEST
      # ==========================================================

      - name: Test compiler
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo " Compiler test"
          echo "=========================================="

          GCC="$ANDROID_GCC/bin/aarch64-linux-android-gcc"

          cat > /tmp/test.c <<'EOF'
          int test_function(const char *input)
          {
              char buffer[128];

              if (input)
                  buffer[0] = input[0];

              return 0;
          }
          EOF

          "$GCC" \
            -fstack-protector-strong \
            -c \
            /tmp/test.c \
            -o /tmp/test.o

          file /tmp/test.o

      # ==========================================================
      # BUILD KERNEL
      # ==========================================================

      - name: Build kernel
        shell: bash
        run: |
          set -o pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$ANDROID_GCC/bin/aarch64-linux-android-"

          echo "=========================================="
          echo " Building kernel"
          echo "=========================================="

          echo "GCC:"
          "$ANDROID_GCC/bin/aarch64-linux-android-gcc" --version

          echo
          echo "CROSS_COMPILE:"
          echo "$CROSS_COMPILE"

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            2>&1 | tee kernel-build.log

      # ==========================================================
      # BUILD MODULES
      # ==========================================================

      - name: Build modules
        shell: bash
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$ANDROID_GCC/bin/aarch64-linux-android-"

          if grep -q '^CONFIG_MODULES=y' "$OUT_DIR/.config"; then

            echo "Building modules..."

            make \
              -j"$(nproc)" \
              O="$OUT_DIR" \
              ARCH="$ARCH" \
              SUBARCH="$SUBARCH" \
              CROSS_COMPILE="$CROSS_COMPILE" \
              modules

          else
            echo "CONFIG_MODULES is disabled."
          fi

      # ==========================================================
      # BUILD DTBS
      # ==========================================================

      - name: Build DTBs
        shell: bash
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$ANDROID_GCC/bin/aarch64-linux-android-"

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            dtbs

      # ==========================================================
      # INSTALL MODULES
      # ==========================================================

      - name: Install modules
        shell: bash
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$ANDROID_GCC/bin/aarch64-linux-android-"

          if grep -q '^CONFIG_MODULES=y' "$OUT_DIR/.config"; then

            rm -rf "$OUT_DIR/modules"

            mkdir -p "$OUT_DIR/modules"

            make \
              O="$OUT_DIR" \
              ARCH="$ARCH" \
              SUBARCH="$SUBARCH" \
              CROSS_COMPILE="$CROSS_COMPILE" \
              modules_install \
              INSTALL_MOD_PATH="$GITHUB_WORKSPACE/$OUT_DIR/modules"

          else
            echo "CONFIG_MODULES is disabled."
          fi

      # ==========================================================
      # COLLECT OUTPUT
      # ==========================================================

      - name: Collect output
        shell: bash
        run: |
          set -eux

          rm -rf release

          mkdir -p \
            release \
            release/dtb \
            release/dtbo \
            release/modules

          BOOT="$OUT_DIR/arch/arm64/boot"

          echo "=========================================="
          echo " Collecting kernel"
          echo "=========================================="

          for IMAGE in \
            Image \
            Image.gz \
            Image.lz4 \
            Image.gz-dtb \
            Image-dtb
          do
            if [ -f "$BOOT/$IMAGE" ]; then
              echo "Found: $IMAGE"
              cp "$BOOT/$IMAGE" "release/$IMAGE"
            fi
          done

          echo
          echo "DTBs:"

          find "$BOOT" \
            -type f \
            -name '*.dtb' \
            -exec cp {} release/dtb/ \; \
            || true

          echo
          echo "DTBOs:"

          find "$BOOT" \
            -type f \
            -name '*.dtbo' \
            -exec cp {} release/dtbo/ \; \
            || true

          echo
          echo "Modules:"

          find "$OUT_DIR" \
            -type f \
            -name '*.ko' \
            -exec cp {} release/modules/ \; \
            || true

          echo
          echo "Release:"
          find release \
            -type f \
            | sort

      # ==========================================================
      # VALIDATE KERNEL
      # ==========================================================

      - name: Validate kernel output
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo " Validating output"
          echo "=========================================="

          KERNEL_FOUND=0

          for IMAGE in \
            release/Image \
            release/Image.gz \
            release/Image.lz4 \
            release/Image.gz-dtb \
            release/Image-dtb
          do
            if [ -f "$IMAGE" ]; then
              echo "Kernel found: $IMAGE"
              KERNEL_FOUND=1
            fi
          done

          if [ "$KERNEL_FOUND" -eq 0 ]; then
            echo "::error::No kernel Image was produced."

            find "$OUT_DIR/arch/arm64/boot" \
              -maxdepth 2 \
              -type f \
              | sort \
              || true

            exit 1
          fi

      # ==========================================================
      # MODULES.LOAD
      # ==========================================================

      - name: Generate modules.load
        shell: bash
        run: |
          set -eux

          : > release/modules.load

          find release/modules \
            -maxdepth 1 \
            -type f \
            -name '*.ko' \
            -printf '%f\n' \
            | sort \
            > release/modules.load

          echo "modules.load:"
          cat release/modules.load

      # ==========================================================
      # BUILD INFORMATION
      # ==========================================================

      - name: Generate build information
        env:
          DEFCONFIG: ${{ steps.config.outputs.DEFCONFIG }}
        shell: bash
        run: |
          set -eux

          KERNEL_VERSION="$(
            make \
              O="$OUT_DIR" \
              ARCH=arm64 \
              kernelversion \
              2>/dev/null \
              || echo unknown
          )"

          cat > release/build-info.txt <<EOF
          ==========================================
          Xiaomi Camellian Kernel
          ==========================================

          Device:
          POCO M3 Pro 5G
          Redmi Note 10 5G
          Redmi Note 10T

          Codename:
          camellian

          Platform:
          MediaTek MT6785

          Android:
          Android T

          Repository:
          MiCode/Xiaomi_Kernel_OpenSource

          Branch:
          camellian-t-oss

          Commit:
          $(git rev-parse HEAD)

          Kernel:
          $KERNEL_VERSION

          Architecture:
          arm64

          Defconfig:
          $DEFCONFIG

          Compiler:
          AArch64 Android GCC 4.9

          Build date:
          $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ==========================================
          EOF

          cat release/build-info.txt

      # ==========================================================
      # PACKAGE
      # ==========================================================

      - name: Package kernel
        shell: bash
        run: |
          set -eux

          ZIP_NAME="camellian-kernel-${GITHUB_SHA::7}.zip"

          cd release

          zip \
            -r \
            "../$ZIP_NAME" \
            . \
            >/dev/null

          cd ..

          echo "=========================================="
          echo " Package"
          echo "=========================================="

          ls -lh "$ZIP_NAME"

      # ==========================================================
      # UPLOAD ARTIFACT
      # ==========================================================

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: camellian-kernel
          path: |
            camellian-kernel-*.zip
            release/
            kernel-build.log
          if-no-files-found: error
          compression-level: 6
