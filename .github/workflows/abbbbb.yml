name: Build Xiaomi Camellian T Kernel

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Build Target"
        required: true
        default: "Image.gz"
        type: choice
        options:
          - Image.gz
          - Image
          - modules

jobs:
  build-kernel:
    name: Camellian T OSS Kernel
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      OUT_DIR: out

    steps:

      # ============================================================
      # CHECKOUT KERNEL
      # ============================================================
      - name: Checkout Xiaomi Kernel
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: camellian-t-oss
          fetch-depth: 1
          submodules: false

      # ============================================================
      # SHOW SOURCE
      # ============================================================
      - name: Verify Kernel Source
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "KERNEL SOURCE"
          echo "=========================================="

          echo "Repository:"
          git remote -v

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Kernel version:"
          make kernelversion

          echo
          echo "drivers/mihw:"
          if [ -d drivers/mihw ]; then
            find drivers/mihw -maxdepth 2 -type f | sort
          else
            echo "drivers/mihw not present."
          fi

      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            lld \
            llvm \
            flex \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            libncurses5-dev \
            python3 \
            rsync \
            cpio \
            kmod \
            lz4 \
            xz-utils \
            zip \
            unzip

      # ============================================================
      # CHECK MTK MODULE REPOSITORY
      # ============================================================
      - name: Prepare Xiaomi MTK Kernel Modules
        shell: bash
        run: |
          set -euo pipefail

          MODULE_REPO="https://github.com/MiCode/MTK_kernel_modules.git"
          MODULE_BRANCH="camellian-t-oss"
          MODULE_DIR="$GITHUB_WORKSPACE/vendor/xiaomi/kernel_modules"

          echo "=========================================="
          echo "XIAOMI MTK KERNEL MODULES"
          echo "=========================================="

          mkdir -p "$GITHUB_WORKSPACE/vendor/xiaomi"

          echo
          echo "Checking repository..."

          if ! git ls-remote \
              --exit-code \
              --heads \
              "$MODULE_REPO" \
              "$MODULE_BRANCH" \
              >/dev/null 2>&1; then

            echo "::warning::Branch '$MODULE_BRANCH' tidak tersedia di MTK_kernel_modules."

            echo
            echo "Available branches containing Camellian:"

            git ls-remote \
              --heads \
              "$MODULE_REPO" \
              | grep -Ei 'camellia|camellian' \
              || true

            echo
            echo "Kernel source membutuhkan:"
            echo "vendor/xiaomi/kernel_modules/mihw/millet"

            echo
            echo "Build akan menggunakan fallback:"
            echo "disable CONFIG_MILLET"

            echo "USE_EXTERNAL_MTK_MODULES=false" >> "$GITHUB_ENV"

            exit 0
          fi

          echo "Module branch exists."

          rm -rf "$MODULE_DIR"

          git clone \
            --depth=1 \
            --branch "$MODULE_BRANCH" \
            "$MODULE_REPO" \
            "$MODULE_DIR"

          echo "USE_EXTERNAL_MTK_MODULES=true" >> "$GITHUB_ENV"

          echo
          echo "Module repository:"
          find "$MODULE_DIR" \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -n 200

      # ============================================================
      # VERIFY MILLET MODULE
      # ============================================================
      - name: Verify Xiaomi MILLET Module
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="vendor/xiaomi/kernel_modules/mihw/millet"

          echo "=========================================="
          echo "CHECKING MILLET"
          echo "=========================================="

          if [ -d "$EXPECTED" ]; then
            echo "MILLET module found:"
            echo "$EXPECTED"

            find "$EXPECTED" \
              -maxdepth 2 \
              -type f \
              | sort

            echo "MILLET_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "::warning::MILLET module tidak ditemukan."

            echo "MILLET_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      # ============================================================
      # DETECT DEFCONFIG
      # ============================================================
      - name: Detect Defconfig
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_DIR="arch/arm64/configs"

          echo "=========================================="
          echo "DEFCONFIG"
          echo "=========================================="

          if [ ! -d "$CONFIG_DIR" ]; then
            echo "::error::$CONFIG_DIR does not exist."
            exit 1
          fi

          echo
          echo "Camellian / MT6785 candidates:"

          find "$CONFIG_DIR" \
            -maxdepth 2 \
            -type f \
            \( \
              -iname "*camellian*" \
              -o \
              -iname "*camellia*" \
              -o \
              -iname "*mt6785*" \
            \) \
            -printf "%f\n" \
            | sort \
            | tee camellian-defconfigs.txt

          DEFCONFIG=""

          for cfg in \
            camellian_defconfig \
            camellian-t_defconfig \
            camellian_user_defconfig \
            camellian_userdebug_defconfig \
            mt6785_defconfig
          do
            if [ -f "$CONFIG_DIR/$cfg" ]; then
              DEFCONFIG="$cfg"
              break
            fi
          done

          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG="$(
              find "$CONFIG_DIR" \
                -maxdepth 2 \
                -type f \
                \( \
                  -iname "*camellian*" \
                  -o \
                  -iname "*camellia*" \
                  -o \
                  -iname "*mt6785*" \
                \) \
                -printf "%f\n" \
                | sort \
                | head -n 1 \
                || true
            )"
          fi

          if [ -z "$DEFCONFIG" ]; then
            echo "::error::Camellian/MT6785 defconfig tidak ditemukan."

            echo
            echo "Available configs:"
            find "$CONFIG_DIR" \
              -maxdepth 2 \
              -type f \
              -printf "%f\n" \
              | sort

            exit 1
          fi

          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_ENV"

          echo
          echo "Selected:"
          echo "$DEFCONFIG"

      # ============================================================
      # CONFIGURE
      # ============================================================
      - name: Configure Kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          export ARCH=arm64
          export SUBARCH=arm64

          export LLVM=1
          export LLVM_IAS=1

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            "$DEFCONFIG"

          test -f "$OUT_DIR/.config"

          echo
          echo "Configuration generated."

      # ============================================================
      # DISABLE EXTERNAL MILLET WHEN UNAVAILABLE
      # ============================================================
      - name: Handle Missing External MILLET
        shell: bash
        run: |
          set -euxo pipefail

          if [ "$MILLET_AVAILABLE" = "true" ]; then
            echo "External MILLET is available."
            exit 0
          fi

          echo "=========================================="
          echo "MILLET FALLBACK"
          echo "=========================================="

          echo "External Xiaomi MILLET source is missing."
          echo "Disabling MILLET/MIHW to allow standalone kernel build."

          if [ -x scripts/config ]; then
            scripts/config \
              --file "$OUT_DIR/.config" \
              -d MILLET \
              -d MIHW \
              || true
          else
            sed -i \
              -e 's/^CONFIG_MILLET=y/# CONFIG_MILLET is not set/' \
              -e 's/^CONFIG_MIHW=y/# CONFIG_MIHW is not set/' \
              "$OUT_DIR/.config"
          fi

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo
          echo "MILLET/MIHW disabled."

      # ============================================================
      # VERIFY CONFIG
      # ============================================================
      - name: Verify Final Configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINAL CONFIG"
          echo "=========================================="

          grep -E \
           
