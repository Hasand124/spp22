name: Build Xiaomi Camellian T Kernelw

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Build target"
        required: true
        default: "Image.gz"
        type: choice
        options:
          - Image.gz
          - Image
          - modules

jobs:
  build-kernel:
    name: Camellian T OSS Kernel
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      OUT_DIR: out

    steps:

      # ============================================================
      # CHECKOUT XIAOMI OFFICIAL SOURCE
      # ============================================================
      - name: Checkout Xiaomi Camellian T OSS
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: camellian-t-oss
          fetch-depth: 1
          submodules: false

      # ============================================================
      # SOURCE INFO
      # ============================================================
      - name: Verify Source
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "XIAOMI CAMELLIAN T OSS"
          echo "=========================================="

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Kernel version:"
          make kernelversion

          echo
          echo "Top level:"
          ls -la

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            lld \
            llvm \
            flex \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            libncurses5-dev \
            python3 \
            rsync \
            cpio \
            kmod \
            lz4 \
            xz-utils \
            zip \
            unzip

      # ============================================================
      # TOOLCHAIN
      # ============================================================
      - name: Setup LLVM Toolchain
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "TOOLCHAIN"
          echo "=========================================="

          echo
          echo "Clang:"
          clang --version

          echo
          echo "LLD:"
          ld.lld --version

          echo
          echo "AArch64 GCC:"
          aarch64-linux-gnu-gcc --version | head -n 1

          echo
          echo "ARM32 GCC:"
          arm-linux-gnueabi-gcc --version | head -n 1

      # ============================================================
      # DETECT DEFCONFIG
      # ============================================================
      - name: Detect Camellian Defconfig
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_DIR="arch/arm64/configs"

          echo "=========================================="
          echo "DEFCONFIG DETECTION"
          echo "=========================================="

          if [ ! -d "$CONFIG_DIR" ]; then
            echo "::error::$CONFIG_DIR does not exist."
            exit 1
          fi

          echo
          echo "Searching Camellian / MT6785 configs..."

          mapfile -t CANDIDATES < <(
            find "$CONFIG_DIR" \
              -maxdepth 2 \
              -type f \
              \( \
                -iname "*camellian*" \
                -o \
                -iname "*mt6785*" \
                -o \
                -iname "*mtk6785*" \
              \) \
              -printf "%f\n" \
              | sort
          )

          printf '%s\n' "${CANDIDATES[@]}" || true

          DEFCONFIG=""

          # Prefer explicit Camellian configurations.
          for cfg in \
            camellian_defconfig \
            camellian-t_defconfig \
            camellian_user_defconfig \
            camellian_userdebug_defconfig
          do
            if [ -f "$CONFIG_DIR/$cfg" ]; then
              DEFCONFIG="$cfg"
              break
            fi
          done

          # Otherwise use first Camellian/MT6785 config.
          if [ -z "$DEFCONFIG" ] && [ "${#CANDIDATES[@]}" -gt 0 ]; then
            DEFCONFIG="${CANDIDATES[0]}"
          fi

          if [ -z "$DEFCONFIG" ]; then
            echo "::error::Camellian/MT6785 defconfig tidak ditemukan."

            echo
            echo "All arm64 configurations:"
            find "$CONFIG_DIR" \
              -maxdepth 2 \
              -type f \
              -printf "%f\n" \
              | sort

            exit 1
          fi

          echo
          echo "Selected defconfig:"
          echo "$DEFCONFIG"

          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_ENV"

      # ============================================================
      # CONFIGURE
      # ============================================================
      - name: Configure Kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          export ARCH=arm64
          export SUBARCH=arm64

          export LLVM=1
          export LLVM_IAS=1

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            "$DEFCONFIG"

          test -f "$OUT_DIR/.config"

          echo
          echo "=========================================="
          echo "CONFIGURATION SUCCESS"
          echo "=========================================="

          grep -E \
            'CONFIG_(64BIT|ARM64|MODULES|LOCALVERSION|CC_IS_CLANG)' \
            "$OUT_DIR/.config" \
            || true

      # ============================================================
      # BUILD KERNEL
      # ============================================================
      - name: Build Kernel
        shell: bash
        run: |
          set -o pipefail

          export ARCH=arm64
          export SUBARCH=arm64

          export LLVM=1
          export LLVM_IAS=1

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=========================================="
          echo "BUILDING KERNEL"
          echo "=========================================="

          echo
          echo "Kernel:"
          make O="$OUT_DIR" kernelversion

          echo
          echo "Compiler:"
          clang --version | head -n 1

          echo
          echo "CPU:"
          nproc

          echo
          echo "Starting build..."

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            2>&1 | tee kernel-build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo
            echo "=========================================="
            echo "BUILD FAILED"
            echo "=========================================="

            echo
            echo "Relevant errors:"
            grep -iE \
              'error:|fatal error:|undefined reference|No such file|not found|failed' \
              kernel-build.log \
              | tail -n 150 \
              || true

            exit "$BUILD_STATUS"
          fi

          echo
          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

      # ============================================================
      # BUILD MODULES
      # ============================================================
      - name: Build Modules
        if: ${{ github.event.inputs.build_target == 'modules' }}
        shell: bash
        run: |
          set -euxo pipefail

          export ARCH=arm64
          export SUBARCH=arm64

          export LLVM=1
          export LLVM_IAS=1

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            modules

          rm -rf "$GITHUB_WORKSPACE/modules"

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            modules_install \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/modules"

      # ============================================================
      # INSPECT OUTPUT
      # ============================================================
      - name: Inspect Kernel Output
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "KERNEL OUTPUT"
          echo "=========================================="

          if [ ! -d "$OUT_DIR/arch/arm64/boot" ]; then
            echo "::error::Kernel boot output directory not found."
            exit 1
          fi

          find "$OUT_DIR/arch/arm64/boot" \
            -maxdepth 5 \
            -type f \
            -printf "%p\n" \
            | sort

          echo
          echo "Main images:"

          for file in \
            "$OUT_DIR/arch/arm64/boot/Image" \
            "$OUT_DIR/arch/arm64/boot/Image.gz" \
            "$OUT_DIR/arch/arm64/boot/Image.lz4" \
            "$OUT_DIR/arch/arm64/boot/Image.gz-dtb"
          do
            if [ -f "$file" ]; then
              ls -lh "$file"
            fi
          done

      # ============================================================
      # PREPARE RELEASE
      # ============================================================
      - name: Prepare Release
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${{ github.event.inputs.build_target }}"

          rm -rf release
          mkdir -p release

          echo "=========================================="
          echo "PREPARING RELEASE"
          echo "=========================================="

          case "$TARGET" in

            Image.gz)
              IMAGE="$OUT_DIR/arch/arm64/boot/Image.gz"

              if [ ! -f "$IMAGE" ]; then
                echo "::error::Image.gz tidak ditemukan."
                exit 1
              fi

              cp "$IMAGE" release/Image.gz
              ;;

            Image)
              IMAGE="$OUT_DIR/arch/arm64/boot/Image"

              if [ ! -f "$IMAGE" ]; then
                echo "::error::Image tidak ditemukan."
                exit 1
              fi

              cp "$IMAGE" release/Image
              ;;

            modules)
              if [ ! -d "$GITHUB_WORKSPACE/modules" ]; then
                echo "::error::modules directory tidak ditemukan."
                exit 1
              fi

              cp -a \
                "$GITHUB_WORKSPACE/modules" \
                release/modules
              ;;

            *)
              echo "::error::Unknown build target: $TARGET"
              exit 1
              ;;

          esac

          cp "$OUT_DIR/.config" release/kernel.config

          {
            echo "REPOSITORY=MiCode/Xiaomi_Kernel_OpenSource"
            echo "BRANCH=camellian-t-oss"
            echo "DEFCONFIG=$DEFCONFIG"
            echo "TARGET=$TARGET"
            echo "KERNEL_VERSION=$(make O="$OUT_DIR" kernelversion)"
            echo "COMMIT=$(git rev-parse HEAD)"
            echo "BUILD_DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > release/build-info.txt

          echo
          echo "=========================================="
          echo "RELEASE"
          echo "=========================================="

          find release \
            -type f \
            -printf "%p\n" \
            | sort

          echo
          du -ah release

      # ============================================================
      # UPLOAD BUILD LOG
      # ============================================================
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Camellian-T-Build-Log-${{ github.run_number }}
          path: |
            kernel-build.log
            out/.config
          if-no-files-found: ignore
          compression-level: 6

      # ============================================================
      # UPLOAD KERNEL
      # ============================================================
      - name: Upload Kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Camellian-T-Kernel-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          compression-level: 9
