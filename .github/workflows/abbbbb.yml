name: Build Xiaomi Camellian T Kernel

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Build Target"
        required: true
        default: "Image.gz-dtb"
        type: choice
        options:
          - Image.gz-dtb
          - Image.gz
          - Image
          - modules

jobs:
  build-kernel:
    name: Build Camellian T Kernel
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      OUT_DIR: out

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Hasand124/spp22
          ref: camellian-t-oss
          fetch-depth: 1
          submodules: recursive

      # ============================================================
      # SOURCE INFORMATION
      # ============================================================
      - name: Show Source Information
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "SOURCE INFORMATION"
          echo "=========================================="

          echo "Repository:"
          git remote -v

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Kernel version:"
          make kernelversion

          echo
          echo "Architecture:"
          uname -m

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            lz4 \
            pahole \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # TOOLCHAIN
      # ============================================================
      - name: Download Android GCC Toolchains
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$GITHUB_WORKSPACE/toolchains"

          git clone --depth=1 \
            https://github.com/protocol-v/aarch64-linux-android-4.9.git \
            "$GITHUB_WORKSPACE/toolchains/gcc64"

          git clone --depth=1 \
            https://github.com/protocol-v/arm-linux-androideabi-4.9.git \
            "$GITHUB_WORKSPACE/toolchains/gcc32"

          echo "$GITHUB_WORKSPACE/toolchains/gcc64/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/toolchains/gcc32/bin" >> "$GITHUB_PATH"

      # ============================================================
      # VERIFY TOOLCHAIN
      # ============================================================
      - name: Verify Toolchain
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "TOOLCHAIN"
          echo "=========================================="

          command -v aarch64-linux-android-gcc
          command -v arm-linux-androideabi-gcc

          aarch64-linux-android-gcc --version
          arm-linux-androideabi-gcc --version

      # ============================================================
      # DETECT DEFCONFIG
      # ============================================================
      - name: Detect Defconfig
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_DIR="arch/arm64/configs"

          echo "=========================================="
          echo "SEARCHING DEFCONFIG"
          echo "=========================================="

          if [ ! -d "$CONFIG_DIR" ]; then
            echo "::error::$CONFIG_DIR tidak ditemukan."
            exit 1
          fi

          echo "Candidate configs:"

          find "$CONFIG_DIR" \
            -maxdepth 1 \
            -type f \
            \( \
              -iname "*camellian*" \
              -o \
              -iname "*mt6785*" \
              -o \
              -iname "*surya*" \
            \) \
            -printf "%f\n" \
            | sort || true

          DEFCONFIG=""

          for cfg in \
            camellian_defconfig \
            camellian-t_defconfig \
            camellian_user_defconfig \
            camellian_userdebug_defconfig \
            mt6785_defconfig
          do
            if [ -f "$CONFIG_DIR/$cfg" ]; then
              DEFCONFIG="$cfg"
              break
            fi
          done

          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG="$(
              find "$CONFIG_DIR" \
                -maxdepth 1 \
                -type f \
                \( \
                  -iname "*camellian*" \
                  -o \
                  -iname "*mt6785*" \
                \) \
                -printf "%f\n" \
                | sort \
                | head -n 1
            )"
          fi

          if [ -z "$DEFCONFIG" ]; then
            echo "::error::Camellian/MT6785 defconfig tidak ditemukan."

            echo
            echo "All available defconfigs:"
            find "$CONFIG_DIR" \
              -maxdepth 1 \
              -type f \
              -printf "%f\n" \
              | sort

            exit 1
          fi

          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_ENV"

          echo
          echo "Selected defconfig:"
          echo "$DEFCONFIG"

      # ============================================================
      # CONFIGURE
      # ============================================================
      - name: Configure Kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            "$DEFCONFIG"

          test -f "$OUT_DIR/.config"

          echo
          echo "Kernel configuration generated successfully."

          echo
          echo "CONFIGURATION:"
          grep -E \
            'CONFIG_(LOCALVERSION|CC_VERSION_TEXT|MODULES|ARM64|64BIT)' \
            "$OUT_DIR/.config" \
            || true

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build Kernel
        shell: bash
        run: |
          set -o pipefail

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          echo "=========================================="
          echo "BUILDING KERNEL"
          echo "=========================================="

          echo "CPU:"
          nproc

          echo
          echo "Compiler:"
          aarch64-linux-android-gcc --version | head -n 1

          echo
          echo "Starting build..."

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            2>&1 | tee kernel-build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo
          echo "Build exit status: $BUILD_STATUS"

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo
            echo "=========================================="
            echo "LAST BUILD ERRORS"
            echo "=========================================="

            grep -iE \
              'error:|fatal error:|undefined reference|No such file|not found|failed' \
              kernel-build.log \
              | tail -n 100 \
              || true

            echo
            echo "Full build log saved as artifact."

            exit "$BUILD_STATUS"
          fi

      # ============================================================
      # BUILD MODULES
      # ============================================================
      - name: Build Modules
        if: ${{ github.event.inputs.build_target == 'modules' }}
        shell: bash
        run: |
          set -euxo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            modules

          rm -rf "$GITHUB_WORKSPACE/modules"

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            modules_install \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/modules"

      # ============================================================
      # INSPECT OUTPUT
      # ============================================================
      - name: Inspect Kernel Output
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "KERNEL OUTPUT"
          echo "=========================================="

          find "$OUT_DIR/arch/arm64/boot" \
            -maxdepth 5 \
            -type f \
            -printf "%p\n" \
            | sort

          echo
          echo "Kernel images:"

          ls -lh \
            "$OUT_DIR/arch/arm64/boot/Image" \
            "$OUT_DIR/arch/arm64/boot/Image.gz" \
            "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" \
            2>/dev/null || true

      # ============================================================
      # PREPARE RELEASE
      # ============================================================
      - name: Prepare Release
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${{ github.event.inputs.build_target }}"

          rm -rf release
          mkdir -p release

          echo "=========================================="
          echo "PREPARING RELEASE"
          echo "=========================================="

          case "$TARGET" in

            Image.gz-dtb)
              if [ -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
                cp \
                  "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" \
                  release/Image.gz-dtb

              elif [ -f "$OUT_DIR/arch/arm64/boot/Image.gz" ]; then
                echo "::warning::Image.gz-dtb tidak dibuat oleh kernel build."
                echo "::warning::Menggunakan Image.gz sebagai fallback."

                cp \
                  "$OUT_DIR/arch/arm64/boot/Image.gz" \
                  release/Image.gz

              else
                echo "::error::Image.gz tidak ditemukan."
                exit 1
              fi
              ;;

            Image.gz)
              test -f "$OUT_DIR/arch/arm64/boot/Image.gz"

              cp \
                "$OUT_DIR/arch/arm64/boot/Image.gz" \
                release/Image.gz
              ;;

            Image)
              test -f "$OUT_DIR/arch/arm64/boot/Image"

              cp \
                "$OUT_DIR/arch/arm64/boot/Image" \
                release/Image
              ;;

            modules)
              test -d "$GITHUB_WORKSPACE/modules"

              cp -a \
                "$GITHUB_WORKSPACE/modules" \
                release/modules
              ;;

            *)
              echo "::error::Unknown build target: $TARGET"
              exit 1
              ;;

          esac

          cp \
            "$OUT_DIR/.config" \
            release/kernel.config

          {
            echo "DEFCONFIG=$DEFCONFIG"
            echo "TARGET=$TARGET"
            echo "KERNEL_VERSION=$(make O="$OUT_DIR" kernelversion)"
            echo "COMMIT=$(git rev-parse HEAD)"
            echo "BUILD_DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > release/build-info.txt

          echo
          echo "=========================================="
          echo "RELEASE CONTENT"
          echo "=========================================="

          find release \
            -type f \
            -printf "%p\n" \
            | sort

          echo
          du -ah release

      # ============================================================
      # UPLOAD BUILD LOG
      # ============================================================
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Camellian-T-build-log-${{ github.run_number }}
          path: |
            kernel-build.log
            out/.config
          if-no-files-found: ignore
          compression-level: 6

      # ============================================================
      # UPLOAD KERNEL
      # ============================================================
      - name: Upload Kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Camellian-T-Kernel-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          compression-level: 9
