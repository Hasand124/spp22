name: Build Xiaomi Camellian Kernel333

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Build Target"
        required: true
        default: "Image.gz-dtb"
        type: choice
        options:
          - Image.gz-dtb
          - Image.gz
          - Image
          - modules

jobs:
  build-kernel:
    name: Build Camellian T Kernel
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      OUT_DIR: out

    steps:

      # ============================================================
      # VERIFY REPOSITORY BRANCH
      # ============================================================
      - name: Verify Camellian T OSS Branch
        shell: bash
        run: |
          set -euo pipefail

          REPOSITORY="https://github.com/Hasand124/spp22.git"
          BRANCH="camellian-t-oss"

          echo "Checking repository: $REPOSITORY"
          echo "Checking branch: $BRANCH"

          if ! git ls-remote --exit-code --heads "$REPOSITORY" "$BRANCH"; then
            echo "::error::Branch '$BRANCH' tidak ditemukan atau repository tidak dapat diakses."
            echo
            echo "Remote branches yang tersedia:"
            git ls-remote --heads "$REPOSITORY" || true
            exit 1
          fi

          echo "Branch '$BRANCH' tersedia."

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Camellian T OSS
        uses: actions/checkout@v4
        with:
          repository: Hasand124/spp22
          ref: camellian-t-oss
          fetch-depth: 1
          submodules: false

      # ============================================================
      # INITIALIZE SUBMODULES
      # ============================================================
      - name: Initialize Git Submodules
        shell: bash
        run: |
          set -euo pipefail

          if [ -f .gitmodules ]; then
            git submodule sync --recursive
            git submodule update --init --recursive
          else
            echo "No .gitmodules file found. Skipping submodules."
          fi

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # TOOLCHAIN
      # ============================================================
      - name: Download Android GCC 4.9
        run: |
          set -e

          git clone --depth=1 \
            https://github.com/protocol-v/aarch64-linux-android-4.9.git \
            gcc64

          git clone --depth=1 \
            https://github.com/protocol-v/arm-linux-androideabi-4.9.git \
            gcc32

          echo "$GITHUB_WORKSPACE/gcc64/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/gcc32/bin" >> "$GITHUB_PATH"

      # ============================================================
      # VERIFY TOOLCHAIN
      # ============================================================
      - name: Verify Toolchain
        run: |
          set -e

          echo "AArch64 GCC:"
          aarch64-linux-android-gcc --version

          echo
          echo "ARM32 GCC:"
          arm-linux-androideabi-gcc --version

      # ============================================================
      # INSPECT SOURCE
      # ============================================================
      - name: Inspect Kernel Source
        run: |
          set -e

          echo "=========================================="
          echo "Kernel Source"
          echo "=========================================="

          git branch --show-current
          git rev-parse --short HEAD

          echo
          echo "Kernel version:"
          make kernelversion

          echo
          echo "Available defconfigs:"
          find arch/arm64/configs \
            -type f \
            -printf "%f\n" \
            | sort

      # ============================================================
      # FIND CAMELLIAN DEFCONFIG
      # ============================================================
      - name: Detect Camellian Defconfig
        shell: bash
        run: |
          set -e

          echo "Searching Camellian defconfig..."

          DEFCONFIG=""

          for cfg in \
            camellian_defconfig \
            camellian-t_defconfig \
            camellian_user_defconfig \
            camellian_userdebug_defconfig \
            mt6785_defconfig
          do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              DEFCONFIG="$cfg"
              break
            fi
          done

          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG=$(find arch/arm64/configs \
              -type f \
              \( \
                -iname "*camellian*" \
                -o \
                -iname "*mt6785*" \
              \) \
              -printf "%f\n" \
              | head -n 1 || true)
          fi

          if [ -z "$DEFCONFIG" ]; then
            echo "::error::Camellian/MT6785 defconfig tidak ditemukan."

            echo
            echo "Available configs:"
            find arch/arm64/configs \
              -type f \
              -printf "%f\n" \
              | sort

            exit 1
          fi

          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_ENV"

          echo
          echo "Using:"
          echo "$DEFCONFIG"

      # ============================================================
      # CONFIGURE KERNEL
      # ============================================================
      - name: Configure Kernel
        run: |
          set -e

          mkdir -p "$OUT_DIR"

          make O="$OUT_DIR" \
            ARCH="$ARCH" \
            "$DEFCONFIG"

          test -f "$OUT_DIR/.config"

          echo
          echo "Kernel configuration generated."

      # ============================================================
      # BUILD KERNEL
      # ============================================================
      - name: Build Kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          echo "=========================================="
          echo "Building Kernel"
          echo "=========================================="

          echo
          echo "CPU:"
          nproc

          echo
          echo "Compiler:"
          aarch64-linux-android-gcc --version | head -n 1

          make -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32"

      # ============================================================
      # BUILD MODULES
      # ============================================================
      - name: Build Kernel Modules
        if: ${{ github.event.inputs.build_target == 'modules' }}
        run: |
          set -e

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            modules

          make -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            modules_install \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/modules"

      # ============================================================
      # INSPECT BOOT OUTPUT
      # ============================================================
      - name: Inspect Boot Output
        run: |
          set -e

          echo "=========================================="
          echo "arch/arm64/boot"
          echo "=========================================="

          find "$OUT_DIR/arch/arm64/boot" \
            -maxdepth 4 \
            -type f \
            -printf "%p\n" \
            | sort

      # ============================================================
      # CREATE Image.gz-dtb
      # ============================================================
      - name: Create Image.gz-dtb
        if: ${{ github.event.inputs.build_target == 'Image.gz-dtb' }}
        shell: bash
        run: |
          set -e

          IMAGE="$OUT_DIR/arch/arm64/boot/Image.gz"
          OUTPUT="$OUT_DIR/arch/arm64/boot/Image.gz-dtb"

          if [ ! -f "$IMAGE" ]; then
            echo "::error::Image.gz tidak ditemukan."
            exit 1
          fi

          echo "Searching MT6785/Camellian DTB..."

          DTB=""

          DTB=$(find "$OUT_DIR/arch/arm64/boot/dts" \
            -type f \
            -name "*.dtb" \
            \( \
              -iname "*camellian*" \
              -o \
              -iname "*camellia*" \
              -o \
              -iname "*mt6785*" \
            \) \
            | head -n 1 || true)

          if [ -z "$DTB" ]; then
            echo "::error::Camellian/MT6785 DTB tidak ditemukan."

            echo
            echo "Available DTBs:"
            find "$OUT_DIR/arch/arm64/boot/dts" \
              -type f \
              -name "*.dtb" \
              | sort

            exit 1
          fi

          echo
          echo "Selected DTB:"
          echo "$DTB"

          cat "$IMAGE" "$DTB" > "$OUTPUT"

          echo
          echo "Created:"
          ls -lh "$OUTPUT"

      # ============================================================
      # PREPARE ARTIFACT
      # ============================================================
      - name: Prepare Release
        shell: bash
        run: |
          set -e

          mkdir -p release

          TARGET="${{ github.event.inputs.build_target }}"

          case "$TARGET" in

            Image.gz-dtb)
              cp "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" \
                release/Image.gz-dtb
              ;;

            Image.gz)
              cp "$OUT_DIR/arch/arm64/boot/Image.gz" \
                release/Image.gz
              ;;

            Image)
              cp "$OUT_DIR/arch/arm64/boot/Image" \
                release/Image
              ;;

            modules)
              cp -a modules release/
              ;;

          esac

          cp "$OUT_DIR/.config" \
            release/kernel.config

          echo "DEFCONFIG=$DEFCONFIG" \
            > release/build-info.txt

          echo "TARGET=$TARGET" \
            >> release/build-info.txt

          echo "KERNEL_VERSION=$(make O="$OUT_DIR" kernelversion)" \
            >> release/build-info.txt

          echo "COMMIT=$(git rev-parse HEAD)" \
            >> release/build-info.txt

          echo
          echo "=========================================="
          echo "Release"
          echo "=========================================="

          ls -lah release/

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Camellian-T-Kernel-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          compression-level: 9
