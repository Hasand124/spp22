name: Build Xiaomi Camellian T Kernelw

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Kernel build target"
        required: true
        default: "Image.gz"
        type: choice
        options:
          - Image.gz
          - Image
          - modules

jobs:
  build-kernel:
    name: Build Camellian T OSS Kernel
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      OUT_DIR: out

    steps:

      # ============================================================
      # CHECKOUT XIAOMI SOURCE
      # ============================================================
      - name: Checkout Xiaomi Camellian T OSS
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: camellian-t-oss
          fetch-depth: 1
          submodules: false

      # ============================================================
      # SHOW SOURCE INFORMATION
      # ============================================================
      - name: Show Source Information
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "CAMELLIAN T OSS"
          echo "=========================================="

          echo "Repository:"
          git remote -v

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Kernel version:"
          make kernelversion

          echo
          echo "Architecture:"
          echo "$ARCH"

      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # SETUP GCC 4.9
      # ============================================================
      - name: Setup Android GCC 4.9
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$GITHUB_WORKSPACE/toolchains"

          echo "Cloning AArch64 GCC 4.9..."

          git clone \
            --depth=1 \
            https://github.com/protocol-v/aarch64-linux-android-4.9.git \
            "$GITHUB_WORKSPACE/toolchains/gcc64"

          echo "Cloning ARM32 GCC 4.9..."

          git clone \
            --depth=1 \
            https://github.com/protocol-v/arm-linux-androideabi-4.9.git \
            "$GITHUB_WORKSPACE/toolchains/gcc32"

          echo "$GITHUB_WORKSPACE/toolchains/gcc64/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/toolchains/gcc32/bin" >> "$GITHUB_PATH"

      # ============================================================
      # VERIFY TOOLCHAIN
      # ============================================================
      - name: Verify Toolchain
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "TOOLCHAIN"
          echo "=========================================="

          echo "AArch64 compiler:"
          command -v aarch64-linux-android-gcc
          aarch64-linux-android-gcc --version

          echo
          echo "ARM32 compiler:"
          command -v arm-linux-androideabi-gcc
          arm-linux-androideabi-gcc --version

      # ============================================================
      # INSPECT CONFIGS
      # ============================================================
      - name: Inspect Kernel Configurations
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AVAILABLE DEFCONFIGS"
          echo "=========================================="

          if [ ! -d arch/arm64/configs ]; then
            echo "::error::arch/arm64/configs does not exist."
            exit 1
          fi

          find arch/arm64/configs \
            -maxdepth 2 \
            -type f \
            -printf "%p\n" \
            | sort \
            | tee available-defconfigs.txt

      # ============================================================
      # DETECT CAMELLIAN DEFCONFIG
      # ============================================================
      - name: Detect Camellian Defconfig
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DETECTING DEFCONFIG"
          echo "=========================================="

          DEFCONFIG=""

          # First try known Camellian names.
          for cfg in \
            camellian_defconfig \
            camellian-t_defconfig \
            camellian_user_defconfig \
            camellian_userdebug_defconfig \
            mt6785_defconfig
          do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              DEFCONFIG="$cfg"
              break
            fi
          done

          # If not found, search automatically.
          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG="$(
              find arch/arm64/configs \
                -type f \
                \( \
                  -iname "*camellian*" \
                  -o \
                  -iname "*mt6785*" \
                  -o \
                  -iname "*mtk*" \
                \) \
                -printf "%f\n" \
                | sort \
                | head -n 1 \
                || true
            )"
          fi

          if [ -z "$DEFCONFIG" ]; then
            echo "::error::No Camellian/MT6785 defconfig found."

            echo
            echo "Available configurations:"
            cat available-defconfigs.txt

            exit 1
          fi

          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_ENV"

          echo
          echo "Selected defconfig:"
          echo "$DEFCONFIG"

      # ============================================================
      # CONFIGURE
      # ============================================================
      - name: Configure Kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            "$DEFCONFIG"

          if [ ! -f "$OUT_DIR/.config" ]; then
            echo "::error::.config was not generated."
            exit 1
          fi

          echo
          echo "Kernel configuration generated successfully."

          echo
          echo "Important configuration:"
          grep -E \
            'CONFIG_(64BIT|ARM64|MODULES|LOCALVERSION)' \
            "$OUT_DIR/.config" \
            || true

      # ============================================================
      # BUILD KERNEL
      # ============================================================
      - name: Build Kernel
        shell: bash
        run: |
          set -o pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          echo
          echo "Kernel:"
          make O="$OUT_DIR" kernelversion

          echo
          echo "CPU:"
          nproc

          echo
          echo "Compiler:"
          aarch64-linux-android-gcc --version | head -n 1

          echo
          echo "Starting build..."

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            2>&1 | tee kernel-build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo
            echo "=========================================="
            echo "BUILD FAILED"
            echo "=========================================="

            echo
            echo "Last relevant errors:"

            grep -iE \
              'error:|fatal error:|undefined reference|No such file|not found|failed' \
              kernel-build.log \
              | tail -n 100 \
              || true

            exit "$BUILD_STATUS"
          fi

          echo
          echo "Kernel build completed."

      # ============================================================
      # BUILD MODULES
      # ============================================================
      - name: Build Modules
        if: ${{ github.event.inputs.build_target == 'modules' }}
        shell: bash
        run: |
          set -euxo pipefail

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            modules

          rm -rf "$GITHUB_WORKSPACE/modules"

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            modules_install \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/modules"

      # ============================================================
      # INSPECT OUTPUT
      # ============================================================
      - name: Inspect Build Output
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BOOT OUTPUT"
          echo "=========================================="

          if [ -d "$OUT_DIR/arch/arm64/boot" ]; then
            find "$OUT_DIR/arch/arm64/boot" \
              -maxdepth 5 \
              -type f \
              -printf "%p\n" \
              | sort
          else
            echo "::error::arch/arm64/boot does not exist."
            exit 1
          fi

          echo
          echo "Image files:"

          ls -lh \
            "$OUT_DIR/arch/arm64/boot/Image" \
            "$OUT_DIR/arch/arm64/boot/Image.gz" \
            2>/dev/null || true

      # ============================================================
      # PREPARE ARTIFACT
      # ============================================================
      - name: Prepare Artifact
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${{ github.event.inputs.build_target }}"

          rm -rf release
          mkdir -p release

          case "$TARGET" in

            Image.gz)
              if [ ! -f "$OUT_DIR/arch/arm64/boot/Image.gz" ]; then
                echo "::error::Image.gz was not generated."
                exit 1
              fi

              cp \
                "$OUT_DIR/arch/arm64/boot/Image.gz" \
                release/Image.gz
              ;;

            Image)
              if [ ! -f "$OUT_DIR/arch/arm64/boot/Image" ]; then
                echo "::error::Image was not generated."
                exit 1
              fi

              cp \
                "$OUT_DIR/arch/arm64/boot/Image" \
                release/Image
              ;;

            modules)
              if [ ! -d "$GITHUB_WORKSPACE/modules" ]; then
                echo "::error::Modules directory was not generated."
                exit 1
              fi

              cp -a \
                "$GITHUB_WORKSPACE/modules" \
                release/modules
              ;;

            *)
              echo "::error::Unknown target: $TARGET"
              exit 1
              ;;

          esac

          cp \
            "$OUT_DIR/.config" \
            release/kernel.config

          {
            echo "REPOSITORY=MiCode/Xiaomi_Kernel_OpenSource"
            echo "BRANCH=camellian-t-oss"
            echo "DEFCONFIG=$DEFCONFIG"
            echo "TARGET=$TARGET"
            echo "KERNEL_VERSION=$(make O="$OUT_DIR" kernelversion)"
            echo "COMMIT=$(git rev-parse HEAD)"
            echo "BUILD_DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > release/build-info.txt

          echo
          echo "=========================================="
          echo "RELEASE"
          echo "=========================================="

          find release \
            -type f \
            -printf "%p\n" \
            | sort

          echo
          du -ah release

      # ============================================================
      # UPLOAD BUILD LOG
      # ============================================================
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Camellian-T-Build-Log-${{ github.run_number }}
          path: |
            kernel-build.log
            available-defconfigs.txt
            out/.config
          if-no-files-found: ignore
          compression-level: 6

      # ============================================================
      # UPLOAD KERNEL
      # ============================================================
      - name: Upload Kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Camellian-T-Kernel-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          compression-level: 9
