name: Build Xiaomi Camellian T Kernel 333

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Build Target"
        required: true
        default: "Image.gz"
        type: choice
        options:
          - Image.gz
          - Image
          - modules

jobs:
  build-kernel:
    name: Build Camellian T Kernel
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      OUT_DIR: out

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Hasand124/spp22
          ref: camellian-t-oss
          fetch-depth: 1
          submodules: false

      # ============================================================
      # VERIFY SOURCE
      # ============================================================
      - name: Verify Source
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "SOURCE"
          echo "=========================================="

          echo "Repository:"
          git remote -v

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Branch:"
          git branch -a

          echo
          echo "Kernel version:"
          make kernelversion

      # ============================================================
      # SUBMODULES
      # ============================================================
      - name: Initialize Submodules
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f .gitmodules ]; then
            git submodule sync --recursive
            git submodule update --init --recursive
          else
            echo "No .gitmodules found."
          fi

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            lz4 \
            pahole \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # GCC 4.9
      # ============================================================
      - name: Download Android GCC 4.9
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$GITHUB_WORKSPACE/toolchains"

          git clone --depth=1 \
            https://github.com/protocol-v/aarch64-linux-android-4.9.git \
            "$GITHUB_WORKSPACE/toolchains/gcc64"

          git clone --depth=1 \
            https://github.com/protocol-v/arm-linux-androideabi-4.9.git \
            "$GITHUB_WORKSPACE/toolchains/gcc32"

          echo "$GITHUB_WORKSPACE/toolchains/gcc64/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/toolchains/gcc32/bin" >> "$GITHUB_PATH"

      # ============================================================
      # VERIFY TOOLCHAIN
      # ============================================================
      - name: Verify Toolchain
        shell: bash
        run: |
          set -euxo pipefail

          echo "AArch64:"
          command -v aarch64-linux-android-gcc
          aarch64-linux-android-gcc --version

          echo
          echo "ARM32:"
          command -v arm-linux-androideabi-gcc
          arm-linux-androideabi-gcc --version

      # ============================================================
      # FIND DEFCONFIG
      # ============================================================
      - name: Detect Defconfig
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_DIR="arch/arm64/configs"

          echo "=========================================="
          echo "DEFCONFIG"
          echo "=========================================="

          if [ ! -d "$CONFIG_DIR" ]; then
            echo "::error::$CONFIG_DIR does not exist."
            exit 1
          fi

          echo "Camellian / MT6785 candidates:"

          find "$CONFIG_DIR" \
            -maxdepth 1 \
            -type f \
            \( \
              -iname "*camellian*" \
              -o \
              -iname "*mt6785*" \
            \) \
            -printf "%f\n" \
            | sort || true

          DEFCONFIG=""

          for cfg in \
            camellian_defconfig \
            camellian-t_defconfig \
            camellian_user_defconfig \
            camellian_userdebug_defconfig \
            mt6785_defconfig
          do
            if [ -f "$CONFIG_DIR/$cfg" ]; then
              DEFCONFIG="$cfg"
              break
            fi
          done

          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG="$(
              find "$CONFIG_DIR" \
                -maxdepth 1 \
                -type f \
                \( \
                  -iname "*camellian*" \
                  -o \
                  -iname "*mt6785*" \
                \) \
                -printf "%f\n" \
                | sort \
                | head -n 1
            )"
          fi

          if [ -z "$DEFCONFIG" ]; then
            echo "::error::Camellian/MT6785 defconfig not found."

            echo
            echo "Available configs:"
            find "$CONFIG_DIR" \
              -maxdepth 1 \
              -type f \
              -printf "%f\n" \
              | sort

            exit 1
          fi

          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_ENV"

          echo
          echo "Selected:"
          echo "$DEFCONFIG"

      # ============================================================
      # CONFIGURE
      # ============================================================
      - name: Configure Kernel
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            "$DEFCONFIG"

          test -f "$OUT_DIR/.config"

          echo
          echo "Configuration successful."

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build Kernel
        shell: bash
        run: |
          set -o pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          echo "=========================================="
          echo "BUILDING KERNEL"
          echo "=========================================="

          echo
          echo "Compiler:"
          aarch64-linux-android-gcc --version | head -n 1

          echo
          echo "CPU:"
          nproc

          echo
          echo "Starting make..."

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            2>&1 | tee kernel-build.log

          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            echo
            echo "=========================================="
            echo "BUILD FAILED"
            echo "=========================================="

            echo
            echo "Relevant errors:"

            grep -iE \
              'error:|fatal error:|undefined reference|No such file|not found|failed' \
              kernel-build.log \
              | tail -n 100 \
              || true

            exit "$status"
          fi

      # ============================================================
      # MODULES
      # ============================================================
      - name: Build Modules
        if: ${{ github.event.inputs.build_target == 'modules' }}
        shell: bash
        run: |
          set -euxo pipefail

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            modules

          rm -rf modules

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            modules_install \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/modules"

      # ============================================================
      # INSPECT OUTPUT
      # ============================================================
      - name: Inspect Output
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "OUTPUT"
          echo "=========================================="

          find "$OUT_DIR/arch/arm64/boot" \
            -maxdepth 5 \
            -type f \
            -printf "%p\n" \
            | sort

      # ============================================================
      # PREPARE RELEASE
      # ============================================================
      - name: Prepare Release
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${{ github.event.inputs.build_target }}"

          rm -rf release
          mkdir -p release

          case "$TARGET" in

            Image.gz)
              test -f "$OUT_DIR/arch/arm64/boot/Image.gz"

              cp \
                "$OUT_DIR/arch/arm64/boot/Image.gz" \
                release/Image.gz
              ;;

            Image)
              test -f "$OUT_DIR/arch/arm64/boot/Image"

              cp \
                "$OUT_DIR/arch/arm64/boot/Image" \
                release/Image
              ;;

            modules)
              test -d "$GITHUB_WORKSPACE/modules"

              cp -a \
                "$GITHUB_WORKSPACE/modules" \
                release/modules
              ;;

            *)
              echo "::error::Unsupported target: $TARGET"
              exit 1
              ;;

          esac

          cp \
            "$OUT_DIR/.config" \
            release/kernel.config

          {
            echo "DEFCONFIG=$DEFCONFIG"
            echo "TARGET=$TARGET"
            echo "KERNEL_VERSION=$(make O="$OUT_DIR" kernelversion)"
            echo "COMMIT=$(git rev-parse HEAD)"
            echo "BUILD_DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > release/build-info.txt

          echo
          echo "=========================================="
          echo "RELEASE"
          echo "=========================================="

          find release \
            -type f \
            -printf "%p\n" \
            | sort

      # ============================================================
      # UPLOAD BUILD LOG
      # ============================================================
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Camellian-T-Build-Log-${{ github.run_number }}
          path: |
            kernel-build.log
            out/.config
          if-no-files-found: ignore
          compression-level: 6

      # ============================================================
      # UPLOAD KERNEL
      # ============================================================
      - name: Upload Kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Camellian-T-Kernel-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          compression-level: 9
