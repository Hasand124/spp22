name: Build Xiaomi Camellian Kernelf

on:
  workflow_dispatch:
    inputs:
        build_target:
          description: 'Build Target (default: Image.gz-dtb)'
          required: true
          default: 'Image.gz-dtb'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            binutils \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            git \
            wget \
            rsync \
            unzip \
            zip \
            libncurses-dev \
            python3 \
            ccache \
            libgmp-dev \
            libmpc-dev \
            libmpfr-dev \
            llvm \
            lld

      - name: Setup AOSP Clang Toolchain
        run: |
          echo "Cloning AOSP Clang..."
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/ -b main-ui clang-toolchain || \
          git clone --depth=1 https://github.com/chenxiaolong/Clang-16.0.4.git clang-toolchain
          
          echo "$GITHUB_WORKSPACE/clang-toolchain/bin" >> $GITHUB_PATH

      - name: Setup Kernel Build Configuration
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Pastikan nama defconfig sesuai dengan yang ada di arch/arm64/configs/
          make O=out camellian_defconfig || make O=out defconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          
          # Kompilasi menggunakan Clang
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android-

      - name: Check Build Output
        run: |
          ls -l out/arch/arm64/boot/

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Camellian-Kernel-Output
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtb.img
