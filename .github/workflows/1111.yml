name: Build Xiaomi Camellian Kernelf

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'URL Repository Kernel'
        required: true
        default: 'https://github.com/MiCode/Xiaomi_Kernel_OpenSource'
      kernel_branch:
        description: 'Branch Repository Kernel'
        required: true
        default: 'camellian-t-oss'
      build_target:
        description: 'Build Target'
        required: true
        default: 'Image.gz-dtb'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Set up Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            binutils \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            git \
            wget \
            curl \
            rsync \
            unzip \
            zip \
            libncurses-dev \
            python3 \
            ccache \
            libgmp-dev \
            libmpc-dev \
            libmpfr-dev \
            llvm \
            lld \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Clone Kernel Source
        run: |
          echo "Cloning source code kernel..."
          git clone --depth=1 -b ${{ github.event.inputs.kernel_branch }} ${{ github.event.inputs.kernel_repo }} kernel-source
          echo "KERNEL_DIR=$GITHUB_WORKSPACE/kernel-source" >> $GITHUB_ENV

      - name: Apply Auto-Patches & Strip -Werror
        run: |
          cd ${{ env.KERNEL_DIR }}
          
          echo "=== Patch 1: Unused variable 'nid' in mm/vmscan.c ==="
          if [ -f mm/vmscan.c ]; then
            sed -i 's/int nid;/int nid __maybe_unused;/g' mm/vmscan.c
          fi

          echo "=== Patch 2: mt_get_uartlog_status conflict in include/linux/printk.h ==="
          if [ -f include/linux/printk.h ]; then
            sed -i 's/extern bool mt_get_uartlog_status(void);/#ifndef _MTK_PRINTK_CTRL_H\nextern bool mt_get_uartlog_status(void);\n#endif/g' include/linux/printk.h
          fi

          echo "=== Patch 3: Hapus paksa semua flag -Werror di Makefile ==="
          find . -type f \( -name "Makefile" -o -name "Kbuild" \) -exec sed -i 's/-Werror//g' {} +

      - name: Download AOSP Clang r450784d via Git
        run: |
          echo "Cloning AOSP Clang r450784d..."
          git clone --depth=1 -b android12-release https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 $GITHUB_WORKSPACE/clang-main
          
          # Buat direktori toolchain & pindahkan versi r450784d
          mkdir -p $GITHUB_WORKSPACE/clang-toolchain
          cp -r $GITHUB_WORKSPACE/clang-main/clang-r450784d/* $GITHUB_WORKSPACE/clang-toolchain/
          rm -rf $GITHUB_WORKSPACE/clang-main
          
          echo "$GITHUB_WORKSPACE/clang-toolchain/bin" >> $GITHUB_PATH

      - name: Find and Setup Kernel Defconfig
        run: |
          cd ${{ env.KERNEL_DIR }}
          export ARCH=arm64
          export SUBARCH=arm64

          DEFCONFIG_FILE=$(find arch/arm64/configs/ -type f \( -name "*camellian*" -o -name "*camellia*" -o -name "*defconfig*" \) 2>/devnull | head -n 1)

          if [ -n "$DEFCONFIG_FILE" ]; then
            DEFCONFIG_NAME=$(echo "$DEFCONFIG_FILE" | sed 's|arch/arm64/configs/||')
            echo "Menggunakan defconfig: $DEFCONFIG_NAME"
            make O=out ARCH=arm64 "$DEFCONFIG_NAME"
          else
            echo "ERROR: File defconfig tidak ditemukan!"
            exit 1
          fi

      - name: Build Kernel with Error Catching
        run: |
          cd ${{ env.KERNEL_DIR }}
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang-toolchain/bin:$PATH"

          EXTRA_FLAGS="-Wno-error -Wno-unused-variable -Wno-unused-but-set-variable -Wno-enum-conversion -Wno-implicit-function-declaration -Wno-typedef-redefinition"

          MAKE_CMD=(
            make O=out
            ARCH=arm64
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LLVM=1
            LLVM_IAS=0
            KCFLAGS="$EXTRA_FLAGS"
            KBUILD_CFLAGS="$EXTRA_FLAGS"
          )

          echo "=== Menjalankan Build Paralel ==="
          "${MAKE_CMD[@]}" -j$(nproc) || {
            echo "--------------------------------------------------------"
            echo "BUILD PARALEL GAGAL. Menjalankan ulang dengan -j1 untuk isolasi error..."
            echo "--------------------------------------------------------"
            "${MAKE_CMD[@]}" -j1
          }

      - name: Check Build Output
        run: |
          ls -la ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/ || true

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Camellian-Kernel-Output
          path: |
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz-dtb
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/dtb
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/dtb.img
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn
