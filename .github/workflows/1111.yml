name: Build Xiaomi Camellian Kernel

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target (default: Image.gz-dtb)'
        required: true
        default: 'Image.gz-dtb'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            binutils \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            git \
            wget \
            curl \
            rsync \
            unzip \
            zip \
            libncurses-dev \
            python3 \
            ccache \
            libgmp-dev \
            libmpc-dev \
            libmpfr-dev \
            llvm \
            lld

      - name: Locate Kernel Source Directory
        run: |
          echo "Current directory contents:"
          ls -la
          
          # Cari lokasi Makefile utama kernel jika source disimpan di subfolder
          MAKEFILE_PATH=$(find . -maxdepth 3 -name "Makefile" -exec grep -q "VERSION =" {} \; -print | head -n 1)
          if [ -n "$MAKEFILE_PATH" ]; then
            KERNEL_DIR=$(dirname "$MAKEFILE_PATH")
            echo "Kernel source ditemukan di: $KERNEL_DIR"
            echo "KERNEL_DIR=$KERNEL_DIR" >> $GITHUB_ENV
          else
            echo "KERNEL_DIR=." >> $GITHUB_ENV
          fi

      - name: Download and Setup Clang Toolchain
        run: |
          mkdir -p clang-toolchain
          echo "Downloading ZyCromerZ Clang..."
          curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases/latest | \
          grep "browser_download_url.*tar.gz" | \
          cut -d : -f 2,3 | \
          tr -d \" | \
          wget -i - -O clang.tar.gz
          
          tar -xf clang.tar.gz -C clang-toolchain
          rm clang.tar.gz
          echo "$GITHUB_WORKSPACE/clang-toolchain/bin" >> $GITHUB_PATH

      - name: Find and Setup Kernel Defconfig
        run: |
          cd ${{ env.KERNEL_DIR }}
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Cari file defconfig secara fleksibel di seluruh repository
          DEFCONFIG_FILE=$(find . -type f \( -name "*camellian*" -o -name "*camellia*" -o -name "*defconfig*" \) | grep "configs" | head -n 1)
          
          if [ -n "$DEFCONFIG_FILE" ]; then
            # Ambil nama config saja dari path
            DEFCONFIG_NAME=$(basename "$DEFCONFIG_FILE")
            echo "Ditemukan file defconfig: $DEFCONFIG_FILE"
            echo "Menggunakan target make: $DEFCONFIG_NAME"
            make O=out ARCH=arm64 "$DEFCONFIG_NAME"
          else
            echo "ERROR: Tidak dapat menemukan file defconfig di direktori configs!"
            echo "Daftar direktori saat ini:"
            find . -maxdepth 3 -type d
            exit 1
          fi

      - name: Build Kernel
        run: |
          cd ${{ env.KERNEL_DIR }}
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang-toolchain/bin:$PATH"
          
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1

      - name: Check Build Output
        run: |
          ls -la ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/ || true

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Camellian-Kernel-Output
          path: |
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz-dtb
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/dtb
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/dtb.img
