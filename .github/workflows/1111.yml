name: Build Xiaomi Camellian Kernelf

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target (default: Image.gz-dtb)'
        required: true
        default: 'Image.gz-dtb'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            binutils \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            git \
            wget \
            curl \
            rsync \
            unzip \
            zip \
            libncurses-dev \
            python3 \
            ccache \
            libgmp-dev \
            libmpc-dev \
            libmpfr-dev \
            llvm \
            lld

      - name: Download and Setup Clang Toolchain
        run: |
          mkdir -p clang-toolchain
          echo "Downloading ZyCromerZ Clang..."
          curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases/latest | \
          grep "browser_download_url.*tar.gz" | \
          cut -d : -f 2,3 | \
          tr -d \" | \
          wget -i - -O clang.tar.gz
          
          tar -xf clang.tar.gz -C clang-toolchain
          rm clang.tar.gz
          echo "$GITHUB_WORKSPACE/clang-toolchain/bin" >> $GITHUB_PATH

      - name: Setup Kernel Build Configuration
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Make output directory and configure defconfig
          make O=out ARCH=arm64 camellian_defconfig || make O=out ARCH=arm64 defconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang-toolchain/bin:$PATH"
          
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1

      - name: Check Build Output
        run: |
          ls -la out/arch/arm64/boot/

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Camellian-Kernel-Output
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtb
            out/arch/arm64/boot/dtb.img
