name: Build Xiaomi Camellian Kernelf

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'URL Repository Kernel'
        required: true
        default: 'https://github.com/MiCode/Xiaomi_Kernel_OpenSource'
      kernel_branch:
        description: 'Branch Repository Kernel'
        required: true
        default: 'camellia-r-oss'
      build_target:
        description: 'Build Target (default: Image.gz-dtb)'
        required: true
        default: 'Image.gz-dtb'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Set up Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            binutils \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            git \
            wget \
            curl \
            rsync \
            unzip \
            zip \
            libncurses-dev \
            python3 \
            ccache \
            libgmp-dev \
            libmpc-dev \
            libmpfr-dev \
            llvm \
            lld \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Clone Kernel Source
        run: |
          echo "Cloning source code kernel..."
          git clone --depth=1 -b ${{ github.event.inputs.kernel_branch }} ${{ github.event.inputs.kernel_repo }} kernel-source
          echo "KERNEL_DIR=$GITHUB_WORKSPACE/kernel-source" >> $GITHUB_ENV

      - name: Download and Setup Clang Toolchain
        run: |
          mkdir -p clang-toolchain
          echo "Downloading ZyCromerZ Clang..."
          curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases/latest | \
          grep "browser_download_url.*tar.gz" | \
          cut -d : -f 2,3 | \
          tr -d \" | \
          wget -i - -O clang.tar.gz
          
          tar -xf clang.tar.gz -C clang-toolchain
          rm clang.tar.gz
          
          # Hapus symlink 'as' dari clang-toolchain jika ada agar fallback ke LLVM/Clang
          rm -f $GITHUB_WORKSPACE/clang-toolchain/bin/as
          
          echo "$GITHUB_WORKSPACE/clang-toolchain/bin" >> $GITHUB_PATH

      - name: Find and Setup Kernel Defconfig
        run: |
          cd ${{ env.KERNEL_DIR }}
          export ARCH=arm64
          export SUBARCH=arm64
          
          DEFCONFIG_FILE=$(find arch/arm64/configs/ -type f \( -name "*camellian*" -o -name "*camellia*" -o -name "*defconfig*" \) 2>/dev/null | head -n 1)
          
          if [ -n "$DEFCONFIG_FILE" ]; then
            DEFCONFIG_NAME=$(echo "$DEFCONFIG_FILE" | sed 's|arch/arm64/configs/||')
            echo "Menggunakan defconfig: $DEFCONFIG_NAME"
            make O=out ARCH=arm64 "$DEFCONFIG_NAME"
          else
            echo "ERROR: File defconfig tidak ditemukan!"
            exit 1
          fi

      - name: Build Kernel
        run: |
          cd ${{ env.KERNEL_DIR }}
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang-toolchain/bin:$PATH"
          
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1

      - name: Check Build Output
        run: |
          ls -la ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/ || true

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Camellian-Kernel-Output
          path: |
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz-dtb
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/dtb
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/dtb.img
